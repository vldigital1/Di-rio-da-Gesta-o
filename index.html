        <span style="font-size:12.5px;color:var(--text-3)">Data provável do parto</span>
      </div>
      <button class="btn btn-soft btn-block btn-sm" data-go="perfil">${ic('edit','ic ic-sm')} Ajustar datas</button>
    </div>
  </div>

  <div class="grid g-side">
    <div class="card">
      <div class="card-head"><span class="chip-ic yellow">${ic('star')}</span><h3>Marcos da jornada</h3></div>
      <div class="tl">
        ${feitos.map(m=>tlItem(m,true)).join('')}
        ${prox.map(m=>tlItem(m,false)).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="chip-ic pink">${ic('image')}</span><h3>Últimas memórias</h3>
        <button class="mini-btn" data-go="memorias">${ic('chev-r','ic ic-sm')}</button></div>
      ${ult.length?`<div class="list">${ult.map(e=>`
        <div class="row-item"><span style="font-size:22px">${e.humor||'•'}</span>
          <div class="body"><b>${fmtShort(e.data)} · ${esc(e.titulo||'Registro')}</b><small>${esc((e.texto||'').slice(0,58))}${(e.texto||'').length>58?'…':''}</small></div>
        </div>`).join('')}</div>`
      :`<div class="empty">${ic('image')}<h3>Nenhuma memória ainda</h3><p>Registre como você se sente hoje — daqui a alguns meses isso vale ouro.</p><button class="btn btn-primary btn-sm" data-go="memorias">${ic('plus','ic ic-sm')} Criar primeira</button></div>`}
    </div>
  </div>`;
};
const miniStat=(k,v,d)=>`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:13px 14px">
  <div class="stat"><div class="k">${k}</div><div class="v" style="font-size:22px">${v}</div><div class="d" style="font-size:11.5px">${d}</div></div></div>`;
const tlItem=(m,feito)=>`<div class="tl-item${feito?'':' dim'}">
  <b>Semana ${m.w} · ${esc(m.t)}</b><small>${feito?'concluído':'a caminho'}</small><p>${esc(m.d)}</p></div>`;

BIND.painel=()=>{
  $('#btnResumo').onclick=async()=>{
    await aiRun('Analisando sua semana','Cruzando sintomas, hidratação, peso e consultas',
      ['Coletando registros dos últimos 7 dias','Comparando com a semana anterior','Consultando marcos gestacionais','Redigindo o resumo']);
    $('#resumoTxt').textContent=resumoIA();
    toast('Resumo atualizado');
  };
};

/* ============================== PERFIL ============================== */
ADD_LABEL.perfil='Salvar';
VIEWS.perfil=()=>{
  const p=state.profile, g=gest(), i=imc();
  return `
  <div class="page-head"><div class="t"><h1>Perfil da Gestação</h1>
    <p>Os dados abaixo alimentam todos os cálculos do aplicativo.</p></div></div>

  <div class="grid g-side">
    <div class="card">
      <div class="card-head"><span class="chip-ic pink">${ic('profile')}</span><h3>Dados principais</h3></div>
      <div class="field-row">
        <div class="field"><label>Seu nome</label><input class="input" id="pNome" value="${esc(p.nome)}" placeholder="Como quer ser chamada"></div>
        <div class="field"><label>Nome do bebê (ou apelido)</label><input class="input" id="pBebe" value="${esc(p.bebe)}" placeholder="Ex.: Feijãozinho"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Data da última menstruação</label><input class="input" type="date" id="pDum" value="${p.dum||''}"></div>
        <div class="field"><label>Data provável do parto</label><input class="input" type="date" id="pDpp" value="${p.dpp||''}"></div>
      </div>
      <p class="hint">Ao preencher a última menstruação, a data provável do parto é calculada automaticamente (regra de Naegele: +280 dias).</p>
      <hr class="divider">
      <div class="field-row">
        <div class="field"><label>Sexo do bebê</label><select class="input" id="pSexo">
          ${['surpresa','menina','menino'].map(s=>`<option value="${s}"${p.sexo===s?' selected':''}>${s==='surpresa'?'Ainda é surpresa':s[0].toUpperCase()+s.slice(1)}</option>`).join('')}
        </select></div>
        <div class="field"><label>Tipo sanguíneo</label><select class="input" id="pSangue">
          <option value="">Não informado</option>
          ${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(s=>`<option${p.tipoSangue===s?' selected':''}>${s}</option>`).join('')}
        </select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Altura (cm)</label><input class="input" type="number" id="pAltura" value="${p.altura||''}" min="120" max="220"></div>
        <div class="field"><label>Peso antes da gestação (kg)</label><input class="input" type="number" step="0.1" id="pPeso" value="${p.pesoInicial||''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Obstetra</label><input class="input" id="pMedico" value="${esc(p.medico)}" placeholder="Dra. / Dr."></div>
        <div class="field"><label>Maternidade</label><input class="input" id="pHosp" value="${esc(p.hospital)}" placeholder="Onde pretende ter o bebê"></div>
      </div>
      <button class="btn btn-primary" id="btnSalvarPerfil">${ic('check','ic ic-sm')} Salvar e recalcular</button>
    </div>

    <div>
      <div class="card" style="text-align:center;margin-bottom:18px">
        ${ringHTML(g.pct,g.ok?g.w:'—','semanas')}
        <h3 style="margin-top:14px">${g.ok?TRI_NOME[g.tri]:'Sem data definida'}</h3>
        <p style="font-size:13.5px;color:var(--text-2);margin-top:4px">${g.ok?`${g.total} dias de gestação · faltam ${Math.max(0,g.rest)}`:'Preencha as datas ao lado'}</p>
      </div>
      <div class="card">
        <div class="card-head"><span class="chip-ic mint">${ic('scale')}</span><h3>Corpo</h3></div>
        <div class="list">
          ${infoRow('IMC pré-gestacional',i?i+' kg/m²':'—', i?classIMC(i):'informe peso e altura')}
          ${infoRow('Ganho de peso',(ganhoPeso()>=0?'+':'')+ganhoPeso()+' kg', faixaGanho())}
          ${infoRow('Registros de peso',state.pesos.length,'medições salvas')}
        </div>
        <button class="btn btn-soft btn-block btn-sm" id="btnAddPeso" style="margin-top:12px">${ic('plus','ic ic-sm')} Registrar peso de hoje</button>
      </div>
    </div>
  </div>`;
};
const infoRow=(k,v,d)=>`<div class="row-item"><div class="body"><b>${k}</b><small>${d}</small></div><span class="tag gray">${v}</span></div>`;
function classIMC(v){ return v<18.5?'abaixo do peso':v<25?'peso adequado':v<30?'sobrepeso':'obesidade' }
function faixaGanho(){
  const i=imc(); if(!i) return 'defina altura e peso inicial';
  const f = i<18.5?[12.5,18]:i<25?[11.5,16]:i<30?[7,11.5]:[5,9];
  return `recomendado ${f[0]}–${f[1]} kg no total`;
}
BIND.perfil=()=>{
  $('#pDum').onchange=e=>{ if(e.target.value) $('#pDpp').value=iso(addDays(parseISO(e.target.value),280)); };
  $('#btnSalvarPerfil').onclick=async()=>{
    const p=state.profile;
    p.nome=$('#pNome').value.trim(); p.bebe=$('#pBebe').value.trim();
    p.dum=$('#pDum').value; p.dpp=$('#pDpp').value;
    p.sexo=$('#pSexo').value; p.tipoSangue=$('#pSangue').value;
    p.altura=+$('#pAltura').value||165; p.pesoInicial=+$('#pPeso').value||p.pesoInicial;
    p.medico=$('#pMedico').value.trim(); p.hospital=$('#pHosp').value.trim();
    state.onboarded=true; save();
    await aiRun('Recalculando sua gestação','Atualizando idade gestacional e projeções',
      ['Validando datas informadas','Calculando idade gestacional','Reposicionando marcos e consultas','Atualizando painel']);
    updateTopbar(); repaint(); toast('Perfil salvo e recalculado');
  };
  $('#btnAddPeso').onclick=()=>modalPeso();
};
function modalPeso(){
  openModal({title:'Registrar peso',icon:'scale',cor:'mint',
    body:`<div class="field-row">
      <div class="field"><label>Data</label><input class="input" type="date" id="wD" value="${hoje()}"></div>
      <div class="field"><label>Peso (kg)</label><input class="input" type="number" step="0.1" id="wP" value="${pesoAtual()?.peso||state.profile.pesoInicial||''}"></div></div>
      <p class="hint">O ganho ideal depende do seu IMC inicial: ${faixaGanho()}.</p>`,
    ok:'Salvar peso',
    onOk:()=>{
      const d=$('#wD').value, p=+$('#wP').value;
      if(!d||!p){ toast('Preencha data e peso','warn'); return false; }
      state.pesos=state.pesos.filter(x=>x.data!==d).concat([{data:d,peso:p}]);
      save(); repaint(); toast('Peso registrado');
    }});
}
</script>

<script>
/* ============================== CONSULTAS ============================== */
ADD_LABEL.consultas='Nova consulta';
let calRef=new Date();
const TIPOS_CONSULTA=['Pré-natal de rotina','Ultrassom','Exames laboratoriais','Dentista','Nutricionista','Anestesista','Outro'];

VIEWS.consultas=()=>{
  const futuras=state.consultas.filter(c=>c.data>=hoje()).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const passadas=state.consultas.filter(c=>c.data<hoje()).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
  return `
  <div class="page-head"><div class="t"><h1>Consultas</h1><p>Agende, receba lembretes e chegue preparada com as perguntas certas.</p></div>
    <div class="a"><button class="btn btn-primary" id="btnNovaConsulta">${ic('plus','ic ic-sm')} Nova consulta</button></div></div>

  <div class="grid g-side">
    <div>
      <div class="card" style="margin-bottom:18px">
        <div class="cal-head">
          <button class="mini-btn" id="calPrev">${ic('chev-l','ic ic-sm')}</button>
          <b>${MESES[calRef.getMonth()][0].toUpperCase()+MESES[calRef.getMonth()].slice(1)} de ${calRef.getFullYear()}</b>
          <button class="mini-btn" id="calNext">${ic('chev-r','ic ic-sm')}</button>
          <button class="btn btn-soft btn-sm" id="calHoje">Hoje</button>
        </div>
        <div class="cal-grid">
          ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${calDias()}
        </div>
        <hr class="divider">
        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3)">
          <span style="display:flex;align-items:center;gap:6px"><i style="width:7px;height:7px;border-radius:9px;background:var(--accent-2);display:block"></i> com consulta</span>
          <span style="display:flex;align-items:center;gap:6px"><i style="width:7px;height:7px;border-radius:9px;background:var(--accent);display:block"></i> hoje</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="chip-ic mint">${ic('calendar')}</span><h3>Próximas</h3>
          <span class="tag mint">${futuras.length}</span></div>
        ${futuras.length?`<div class="list">${futuras.map(consultaRow).join('')}</div>`
          :`<div class="empty">${ic('calendar')}<h3>Nenhuma consulta futura</h3><p>Agende seu próximo pré-natal para não perder o acompanhamento.</p>
             <button class="btn btn-primary btn-sm" id="btnNovaConsulta2">${ic('plus','ic ic-sm')} Agendar</button></div>`}
        ${passadas.length?`<hr class="divider"><div class="sb-group-label" style="padding-left:0">Histórico</div>
          <div class="list">${passadas.slice(0,6).map(consultaRow).join('')}</div>`:''}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="chip-ic lilac">${ic('checklist')}</span><h3>Perguntas para levar<div class="sub">Anote enquanto lembra</div></h3></div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input class="input" id="qNova" placeholder="Ex.: posso continuar treinando?">
        <button class="btn btn-primary btn-sm" id="qAdd" style="flex:none">${ic('plus','ic ic-sm')}</button>
      </div>
      ${state.perguntas.length?`<div class="list">${state.perguntas.map((q,i)=>`
        <label class="chk"><input type="checkbox" data-q="${i}"${q.feito?' checked':''}>
          <span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
          <span class="txt">${esc(q.t)}</span>
          <button class="mini-btn danger" data-delq="${i}">${ic('trash','ic ic-sm')}</button></label>`).join('')}</div>`
        :`<div class="empty" style="padding:26px 10px">${ic('checklist')}<h3>Sua lista está vazia</h3><p>Toda dúvida que surgir no meio do dia pode virar uma pergunta aqui.</p></div>`}
      <hr class="divider">
      <button class="btn btn-ghost btn-block btn-sm" id="qSugerir">${ic('spark','ic ic-sm')} Sugerir perguntas para a semana ${gest().w}</button>
    </div>
  </div>`;
};
function consultaRow(c){
  const passou=c.data<hoje();
  return `<div class="row-item">
    <span class="chip-ic ${passou?'gray':'mint'}" style="${passou?'background:var(--surface-3);color:var(--text-3)':''}">${ic(c.tipo==='Ultrassom'?'image':'calendar')}</span>
    <div class="body"><b>${esc(c.titulo)}</b><small>${fmt(c.data)} · ${c.hora} ${c.medico?'· '+esc(c.medico):''} ${c.local?'· '+esc(c.local):''}</small></div>
    <div class="row-actions">
      <button class="mini-btn" data-editc="${c.id}">${ic('edit','ic ic-sm')}</button>
      <button class="mini-btn danger" data-delc="${c.id}">${ic('trash','ic ic-sm')}</button>
    </div></div>`;
}
function calDias(){
  const y=calRef.getFullYear(), m=calRef.getMonth();
  const first=new Date(y,m,1), start=first.getDay(), dias=new Date(y,m+1,0).getDate();
  const prev=new Date(y,m,0).getDate();
  let out='';
  for(let i=start-1;i>=0;i--) out+=`<button class="cal-day out">${prev-i}</button>`;
  for(let d=1;d<=dias;d++){
    const s=`${y}-${pad(m+1)}-${pad(d)}`;
    const has=state.consultas.some(c=>c.data===s);
    out+=`<button class="cal-day${s===hoje()?' today':''}${has?' has':''}" data-dia="${s}">${d}</button>`;
  }
  const total=start+dias, resto=(7-total%7)%7;
  for(let d=1;d<=resto;d++) out+=`<button class="cal-day out">${d}</button>`;
  return out;
}
BIND.consultas=()=>{
  const nova=()=>modalConsulta();
  $('#btnNovaConsulta').onclick=nova;
  if($('#btnNovaConsulta2')) $('#btnNovaConsulta2').onclick=nova;
  $('#calPrev').onclick=()=>{calRef=new Date(calRef.getFullYear(),calRef.getMonth()-1,1);repaint()};
  $('#calNext').onclick=()=>{calRef=new Date(calRef.getFullYear(),calRef.getMonth()+1,1);repaint()};
  $('#calHoje').onclick=()=>{calRef=new Date();repaint()};
  $$('[data-dia]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.dia, cs=state.consultas.filter(c=>c.data===d);
    if(cs.length) openModal({title:fmt(d),icon:'calendar',cor:'mint',ok:'',cancel:'Fechar',
      body:`<div class="list">${cs.map(c=>`<div class="row-item"><div class="body"><b>${esc(c.titulo)}</b><small>${c.hora} · ${esc(c.medico||'—')} · ${esc(c.local||'—')}</small>${c.notas?`<p style="font-size:13.5px;color:var(--text-2);margin-top:6px">${esc(c.notas)}</p>`:''}</div></div>`).join('')}</div>`});
    else modalConsulta(null,d);
  });
  $$('[data-editc]').forEach(b=>b.onclick=()=>modalConsulta(state.consultas.find(c=>c.id===b.dataset.editc)));
  $$('[data-delc]').forEach(b=>b.onclick=()=>{
    state.consultas=state.consultas.filter(c=>c.id!==b.dataset.delc); save(); repaint(); toast('Consulta removida');
  });
  const addQ=()=>{
    const v=$('#qNova').value.trim(); if(!v) return;
    state.perguntas.push({t:v,feito:false}); save(); repaint(); toast('Pergunta adicionada');
  };
  $('#qAdd').onclick=addQ;
  $('#qNova').onkeydown=e=>{if(e.key==='Enter')addQ()};
  $$('[data-q]').forEach(c=>c.onchange=()=>{state.perguntas[+c.dataset.q].feito=c.checked;save()});
  $$('[data-delq]').forEach(b=>b.onclick=e=>{e.preventDefault();state.perguntas.splice(+b.dataset.delq,1);save();repaint()});
  $('#qSugerir').onclick=async()=>{
    const g=gest();
    await aiRun('Preparando suas perguntas','Selecionando o que importa nesta fase da gestação',
      ['Lendo sua idade gestacional','Cruzando com sintomas registrados','Filtrando temas do trimestre','Montando a lista']);
    const sug=sugestoesPerguntas(g.w);
    sug.forEach(t=>{ if(!state.perguntas.some(q=>q.t===t)) state.perguntas.push({t,feito:false}) });
    save(); repaint(); toast(`${sug.length} perguntas adicionadas`);
  };
};
function sugestoesPerguntas(w){
  if(w<14) return ['Quais exames preciso fazer neste trimestre?','Posso continuar meus medicamentos atuais?','Qual ácido fólico e dosagem devo tomar?','O que fazer se o enjoo não passar?'];
  if(w<28) return ['Quando será o ultrassom morfológico?','Meu ganho de peso está adequado?','Posso viajar de avião nesta fase?','Preciso do teste de tolerância à glicose?'];
  return ['Qual a posição do bebê agora?','Quais sinais indicam trabalho de parto?','Como funciona meu plano de parto na maternidade?','Quando devo procurar a maternidade?','Preciso repetir algum exame antes do parto?'];
}
function modalConsulta(c,dataPre){
  const e=c||{id:null,titulo:'',tipo:TIPOS_CONSULTA[0],data:dataPre||hoje(),hora:'09:00',medico:state.profile.medico,local:state.profile.hospital,notas:''};
  openModal({title:c?'Editar consulta':'Nova consulta',icon:'calendar',cor:'mint',
    body:`
      <div class="field"><label>Título</label><input class="input" id="cT" value="${esc(e.titulo)}" placeholder="Ex.: Pré-natal — 24 semanas"></div>
      <div class="field"><label>Tipo</label><select class="input" id="cTipo">${TIPOS_CONSULTA.map(t=>`<option${e.tipo===t?' selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field-row">
        <div class="field"><label>Data</label><input class="input" type="date" id="cD" value="${e.data}"></div>
        <div class="field"><label>Hora</label><input class="input" type="time" id="cH" value="${e.hora}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Profissional</label><input class="input" id="cM" value="${esc(e.medico||'')}"></div>
        <div class="field"><label>Local</label><input class="input" id="cL" value="${esc(e.local||'')}"></div>
      </div>
      <div class="field"><label>Anotações</label><textarea class="input" id="cN" placeholder="O que foi conversado, orientações, resultados…">${esc(e.notas||'')}</textarea></div>`,
    ok:c?'Salvar alterações':'Agendar',
    onOk:()=>{
      const o={id:e.id||uid(),titulo:$('#cT').value.trim()||$('#cTipo').value,tipo:$('#cTipo').value,
        data:$('#cD').value,hora:$('#cH').value,medico:$('#cM').value.trim(),local:$('#cL').value.trim(),notas:$('#cN').value.trim()};
      if(!o.data){toast('Informe a data','warn');return false}
      state.consultas=state.consultas.filter(x=>x.id!==o.id).concat([o]);
      save(); repaint(); toast(c?'Consulta atualizada':'Consulta agendada');
    }});
}

/* ============================== SINTOMAS ============================== */
ADD_LABEL.sintomas='Registrar sintoma';
const SINTOMAS=['Náusea','Enjoo matinal','Fadiga','Azia','Dor nas costas','Dor de cabeça','Inchaço','Insônia','Cãibras','Tontura','Falta de ar','Contrações','Alteração de humor','Desejo alimentar','Sensibilidade nos seios','Prisão de ventre'];
const INTENSIDADE=['Muito leve','Leve','Moderado','Forte','Muito forte'];
let sintPeriodo=7;

VIEWS.sintomas=()=>{
  const lim=sintPeriodo;
  const dados=state.sintomas.filter(s=>diasEntre(s.data,hoje())<lim).sort((a,b)=>b.data.localeCompare(a.data));
  const freq=Object.entries(dados.reduce((a,s)=>(a[s.tipo]=(a[s.tipo]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const serie=[];
  for(let i=lim-1;i>=0;i--){
    const d=iso(addDays(new Date(),-i));
    serie.push({x:fmtShort(d),y:state.sintomas.filter(s=>s.data===d).length});
  }
  const media=dados.length?(dados.reduce((a,s)=>a+s.nivel,0)/dados.length).toFixed(1):'—';
  return `
  <div class="page-head"><div class="t"><h1>Sintomas</h1><p>Registrar o que você sente ajuda seu médico a enxergar padrões.</p></div>
    <div class="a"><button class="btn btn-primary" id="btnNovoSint">${ic('plus','ic ic-sm')} Registrar</button></div></div>

  <div class="seg" style="max-width:380px;margin-bottom:18px">
    ${[7,30,90].map(d=>`<button class="${sintPeriodo===d?'on':''}" data-per="${d}">${d} dias</button>`).join('')}
  </div>

  <div class="grid g3" style="margin-bottom:18px">
    <div class="card"><div class="stat"><div class="k">Registros</div><div class="v">${dados.length}</div><div class="d">nos últimos ${lim} dias</div></div></div>
    <div class="card"><div class="stat"><div class="k">Intensidade média</div><div class="v">${media}<small>/5</small></div><div class="d">${media!=='—'?INTENSIDADE[Math.round(media)-1]||'':'sem dados'}</div></div></div>
    <div class="card"><div class="stat"><div class="k">Mais frequente</div><div class="v" style="font-size:19px">${freq[0]?esc(freq[0][0]):'—'}</div><div class="d">${freq[0]?freq[0][1]+' ocorrências':'nenhum registro'}</div></div></div>
  </div>

  <div class="grid g-side" style="margin-bottom:18px">
    <div class="card">
      <div class="card-head"><span class="chip-ic pink">${ic('pulse')}</span><h3>Registros por dia</h3></div>
      ${chartBars(serie,{h:190,cor:'url(#lineGrad)',un:' registros'})}
    </div>
    <div class="card">
      <div class="card-head"><span class="chip-ic lilac">${ic('analytics')}</span><h3>Mais frequentes</h3></div>
      ${freq.length?freq.map(([t,n])=>`
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px"><span>${esc(t)}</span><b style="font-family:'Poppins'">${n}</b></div>
          <div class="bar"><i style="width:${Math.round(n/freq[0][1]*100)}%"></i></div>
        </div>`).join(''):emptyBox('Nada registrado no período')}
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="chip-ic yellow">${ic('clock')}</span><h3>Histórico</h3>
      <button class="btn btn-ghost btn-sm" id="btnAnaliseSint">${ic('spark','ic ic-sm')} Analisar padrões</button></div>
    ${dados.length?`<div class="list">${dados.slice(0,30).map(s=>`
      <div class="row-item">
        <span class="chip-ic ${['mint','mint','yellow','pink','pink'][s.nivel-1]}">${ic('pulse')}</span>
        <div class="body"><b>${esc(s.tipo)}</b><small>${fmt(s.data)} · ${INTENSIDADE[s.nivel-1]}${s.nota?' · '+esc(s.nota):''}</small></div>
        <button class="mini-btn danger" data-dels="${s.id}">${ic('trash','ic ic-sm')}</button>
      </div>`).join('')}</div>`
      :`<div class="empty">${ic('pulse')}<h3>Nenhum sintoma registrado</h3><p>Registre como está se sentindo — mesmo os dias bons contam.</p></div>`}
  </div>`;
};
BIND.sintomas=()=>{
  $('#btnNovoSint').onclick=()=>modalSintoma();
  $$('[data-per]').forEach(b=>b.onclick=()=>{sintPeriodo=+b.dataset.per;repaint()});
  $$('[data-dels]').forEach(b=>b.onclick=()=>{state.sintomas=state.sintomas.filter(s=>s.id!==b.dataset.dels);save();repaint();toast('Registro removido')});
  $('#btnAnaliseSint').onclick=async()=>{
    await aiRun('Analisando seus sintomas','Buscando correlações com hidratação, sono e semana gestacional',
      ['Agrupando por tipo e intensidade','Comparando com a semana anterior','Cruzando com hidratação e peso','Formulando observações']);
    openModal({title:'Padrões encontrados',icon:'spark',cor:'lilac',ok:'',cancel:'Fechar',body:analiseSintomas()});
  };
};
function analiseSintomas(){
  const d7=state.sintomas.filter(s=>diasEntre(s.data,hoje())<7);
  const d14=state.sintomas.filter(s=>diasEntre(s.data,hoje())>=7&&diasEntre(s.data,hoje())<14);
  if(!d7.length&&!d14.length) return `<p style="color:var(--text-2)">Ainda não há registros suficientes. Registre seus sintomas por alguns dias para que a análise faça sentido.</p>`;
  const freq=Object.entries(d7.reduce((a,s)=>(a[s.tipo]=(a[s.tipo]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]);
  const m7=d7.length?d7.reduce((a,s)=>a+s.nivel,0)/d7.length:0;
  const m14=d14.length?d14.reduce((a,s)=>a+s.nivel,0)/d14.length:0;
  const dif=m14?((m7-m14)/m14*100):0;
  const g=gest();
  let out=`<div class="list">`;
  out+=`<div class="row-item"><div class="body"><b>Volume de registros</b><small>${d7.length} nos últimos 7 dias · ${d14.length} nos 7 anteriores</small></div></div>`;
  if(m14) out+=`<div class="row-item"><div class="body"><b>Intensidade</b><small>Média ${m7.toFixed(1)}/5 — ${dif>5?'aumento':dif<-5?'redução':'estável'} de ${Math.abs(dif).toFixed(0)}% em relação à semana anterior</small></div></div>`;
  if(freq[0]) out+=`<div class="row-item"><div class="body"><b>Sintoma dominante</b><small>${esc(freq[0][0])} (${freq[0][1]}x). ${dicaSintoma(freq[0][0])}</small></div></div>`;
  const ml=Object.entries(state.agua).filter(([d])=>diasEntre(d,hoje())<7).map(([,v])=>v);
  if(ml.length) out+=`<div class="row-item"><div class="body"><b>Hidratação no período</b><small>Média de ${Math.round(ml.reduce((a,b)=>a+b,0)/ml.length)} ml/dia. ${ml.reduce((a,b)=>a+b,0)/ml.length<state.metaAgua*0.8?'Abaixo da meta — desidratação intensifica dor de cabeça, cãibras e contrações de treinamento.':'Dentro de uma faixa saudável.'}</small></div></div>`;
  out+=`<div class="row-item"><div class="body"><b>Contexto da semana ${g.w}</b><small>${esc(contextoSemana(g.w))}</small></div></div>`;
  out+=`</div><p class="hint" style="margin-top:14px">Esta análise é gerada a partir dos seus próprios registros e não substitui avaliação médica. Sangramento, dor forte, febre ou redução de movimentos exigem contato imediato com seu obstetra.</p>`;
  return out;
}
function dicaSintoma(t){
  const m={'Náusea':'Refeições pequenas e frequentes e gengibre costumam ajudar.','Enjoo matinal':'Comer algo seco antes de levantar reduz a intensidade.',
  'Azia':'Evite deitar logo após comer e reduza frituras e cafeína.','Fadiga':'Comum no 1º e 3º trimestres; priorize sono e ferro na dieta.',
  'Dor nas costas':'Alongamento, calor local e travesseiro entre as pernas ajudam.','Inchaço':'Eleve as pernas e reduza sódio; inchaço súbito no rosto/mãos deve ser avaliado.',
  'Cãibras':'Hidratação, magnésio e alongamento da panturrilha antes de dormir.','Insônia':'Rotina noturna e travesseiro de corpo melhoram o sono lateral.',
  'Contrações':'Se forem regulares e progressivas antes de 37 semanas, procure a maternidade.','Dor de cabeça':'Hidrate-se; dor forte com visão turva precisa de avaliação urgente.'};
  return m[t]||'Vale registrar a frequência e comentar na próxima consulta.';
}
function contextoSemana(w){
  if(w<13) return 'No 1º trimestre, enjoo, sono e sensibilidade são esperados pela elevação do hCG e da progesterona.';
  if(w<28) return 'No 2º trimestre os sintomas costumam aliviar; dores lombares e azia aparecem com o crescimento do útero.';
  return 'No 3º trimestre, peso, azia, insônia e contrações de treinamento (Braxton Hicks) são frequentes.';
}
function modalSintoma(){
  openModal({title:'Registrar sintoma',icon:'pulse',cor:'pink',
    body:`<div class="field"><label>Sintoma</label><select class="input" id="sT">${SINTOMAS.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Intensidade</label><div class="seg" id="sNiv">${INTENSIDADE.map((t,i)=>`<button data-n="${i+1}" class="${i===2?'on':''}">${i+1}</button>`).join('')}</div>
        <p class="hint" id="sNivTxt">Moderado</p></div>
      <div class="field-row"><div class="field"><label>Data</label><input class="input" type="date" id="sD" value="${hoje()}"></div></div>
      <div class="field"><label>Observação (opcional)</label><input class="input" id="sN" placeholder="Ex.: piorou depois do almoço"></div>`,
    ok:'Registrar',
    onOk:()=>{
      const n=+($('#sNiv .on')?.dataset.n||3);
      state.sintomas.push({id:uid(),tipo:$('#sT').value,nivel:n,data:$('#sD').value,nota:$('#sN').value.trim()});
      save(); repaint(); toast('Sintoma registrado');
    }});
  $$('#sNiv button').forEach(b=>b.onclick=()=>{
    $$('#sNiv button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    $('#sNivTxt').textContent=INTENSIDADE[+b.dataset.n-1];
  });
}
</script>

<script>
/* ============================== CRESCIMENTO DO BEBÊ ============================== */
ADD_LABEL.crescimento='Registrar peso';
let semanaVista=null;
function chartCrescimento(idx,cor,fill,un,atual){
  const w=620,h=210,pl=40,pr=14,pt=16,pb=28;
  const d=BABY.map(b=>({w:b[0],v:b[idx]}));
  const max=Math.max(...d.map(x=>x.v))*1.1, min=0;
  const X=i=>pl+i*(w-pl-pr)/(d.length-1);
  const Y=v=>pt+(1-(v-min)/(max-min))*(h-pt-pb);
  const p=d.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x.v).toFixed(1)}`).join(' ');
  const area=`${p} L${X(d.length-1).toFixed(1)} ${h-pb} L${X(0).toFixed(1)} ${h-pb} Z`;
  let grid='';
  for(let i=0;i<=3;i++){const v=max*i/3,y=Y(v);
    grid+=`<line class="axis" x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke-dasharray="3 5"/><text class="glab" x="4" y="${(y+3.5).toFixed(1)}">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`}
  const xl=d.map((x,i)=> x.w%6===0||i===d.length-1?`<text class="glab" x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">S${x.w}</text>`:'').join('');
  let mark='';
  const i=d.findIndex(x=>x.w===clamp(atual,4,40));
  if(i>=0){ const cx=X(i),cy=Y(d[i].v);
    mark=`<line x1="${cx.toFixed(1)}" y1="${pt}" x2="${cx.toFixed(1)}" y2="${h-pb}" stroke="${cor}" stroke-width="1.4" stroke-dasharray="5 4" opacity=".6"/>
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6.5" fill="${cor}" stroke="var(--surface)" stroke-width="3"/>
      <text class="glab" x="${clamp(cx,pl+22,w-pr-30).toFixed(1)}" y="${clamp(cy-14,14,h).toFixed(1)}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:${cor}">${d[i].v}${un}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px">${grid}<path d="${area}" fill="${fill}"/><path class="lin" d="${p}" stroke="${cor}"/>${mark}${xl}</svg>`;
}
VIEWS.crescimento=()=>{
  const g=gest(); const sem=clamp(semanaVista??g.w,4,40); const b=babyAt(sem);
  const ant=babyAt(sem-1), cresc=(b[2]-ant[2]).toFixed(1), engordou=b[3]-ant[3];
  const marcos=MARCOS.filter(m=>Math.abs(m[0]-sem)<=4);
  return `
  <div class="page-head"><div class="t"><h1>Crescimento do Bebê</h1><p>Comprimento e peso estimados semana a semana, com marcos de desenvolvimento.</p></div></div>

  <div class="card" style="margin-bottom:18px;background:var(--accent-grad);border:0;color:#3B2E44">
    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
      <div style="flex:1;min-width:230px">
        <span class="tag" style="background:rgba(255,255,255,.5);color:#3B2E44">Semana ${sem}</span>
        <h2 style="font-size:28px;margin:10px 0 6px">Do tamanho de um(a) ${esc(b[1])}</h2>
        <p style="font-size:15px;opacity:.85">Aproximadamente <b>${b[2]} cm</b> e <b>${b[3]>=1000?(b[3]/1000).toFixed(2)+' kg':b[3]+' g'}</b>. Nesta semana ele cresceu cerca de ${cresc} cm e ganhou ${engordou>=1000?(engordou/1000).toFixed(2)+' kg':engordou+' g'}.</p>
      </div>
      <div style="display:flex;gap:12px">
        <div style="background:rgba(255,255,255,.55);border-radius:18px;padding:16px 20px;text-align:center;min-width:96px">
          <b style="font-family:'Poppins';font-size:26px;display:block;letter-spacing:-.03em">${b[2]}</b><span style="font-size:11.5px;font-weight:600">cm</span></div>
        <div style="background:rgba(255,255,255,.55);border-radius:18px;padding:16px 20px;text-align:center;min-width:96px">
          <b style="font-family:'Poppins';font-size:26px;display:block;letter-spacing:-.03em">${b[3]>=1000?(b[3]/1000).toFixed(1):b[3]}</b><span style="font-size:11.5px;font-weight:600">${b[3]>=1000?'kg':'g'}</span></div>
      </div>
    </div>
    <div style="margin-top:20px">
      <input type="range" id="semSlider" min="4" max="40" value="${sem}" style="width:100%;accent-color:#C2185B">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;font-family:'Poppins';opacity:.7;margin-top:4px"><span>Semana 4</span><span>Semana 40</span></div>
    </div>
  </div>

  <div class="grid g2" style="margin-bottom:18px">
    <div class="card"><div class="card-head"><span class="chip-ic blue">${ic('growth')}</span><h3>Comprimento<div class="sub">cm, da cabeça aos pés</div></h3></div>
      ${chartCrescimento(2,'#6FA8E8','url(#chartBlue)',' cm',sem)}</div>
    <div class="card"><div class="card-head"><span class="chip-ic pink">${ic('scale')}</span><h3>Peso<div class="sub">gramas</div></h3></div>
      ${chartCrescimento(3,'#EE7FAE','url(#chartPink)',' g',sem)}</div>
  </div>

  <div class="grid g-side">
    <div class="card">
      <div class="card-head"><span class="chip-ic yellow">${ic('star')}</span><h3>Marcos por perto</h3></div>
      <div class="tl">${marcos.map(m=>`<div class="tl-item${g.w>=m[0]?'':' dim'}"><b>Semana ${m[0]} · ${esc(m[1])}</b><small>${g.w>=m[0]?'já aconteceu':'em breve'}</small><p>${esc(m[2])}</p></div>`).join('')||'<p style="color:var(--text-3)">Sem marcos próximos desta semana.</p>'}</div>
    </div>
    <div class="card">
      <div class="card-head"><span class="chip-ic mint">${ic('scale')}</span><h3>Seu peso</h3>
        <button class="btn btn-ghost btn-sm" id="btnPesoC">${ic('plus','ic ic-sm')}</button></div>
      ${state.pesos.length?chartLine([...state.pesos].sort((a,b)=>a.data.localeCompare(b.data)).map(p=>({x:fmtShort(p.data),y:p.peso})),{h:170,dec:1,un:' kg'})
        :emptyBox('Nenhum peso registrado')}
      <hr class="divider">
      <div class="list">${infoRow('Ganho total',(ganhoPeso()>=0?'+':'')+ganhoPeso()+' kg',faixaGanho())}</div>
    </div>
  </div>`;
};
BIND.crescimento=()=>{
  const s=$('#semSlider');
  s.oninput=()=>{ semanaVista=+s.value; };
  s.onchange=()=>{ semanaVista=+s.value; repaint(); };
  $('#btnPesoC').onclick=()=>modalPeso();
};

/* ============================== NUTRIÇÃO ============================== */
ADD_LABEL.nutricao='Registrar refeição';
const REFEICOES=['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'];
const NUTRIENTES=[
 ['Ácido fólico','600 mcg/dia','Previne defeitos do tubo neural','Folhas verde-escuras, feijão, lentilha, laranja','mint'],
 ['Ferro','27 mg/dia','Evita anemia e sustenta o volume sanguíneo','Carne vermelha, feijão, beterraba com vitamina C','pink'],
 ['Cálcio','1000 mg/dia','Forma ossos e dentes do bebê','Leite, iogurte, queijo, gergelim, brócolis','blue'],
 ['Ômega-3 (DHA)','200–300 mg/dia','Desenvolve cérebro e visão','Sardinha, salmão, chia, linhaça, nozes','lilac'],
 ['Proteína','+25 g/dia no 2º e 3º tri','Constrói tecidos do bebê e da placenta','Ovos, frango, peixe, leguminosas','yellow'],
 ['Vitamina D','600 UI/dia','Ajuda na absorção do cálcio','Sol da manhã, ovo, peixes gordos','mint']
];
const EVITAR=[
 ['Carne e ovo crus ou malpassados','Risco de toxoplasmose e salmonela'],
 ['Peixes com muito mercúrio','Cação, peixe-espada, atum em excesso'],
 ['Leite e queijos não pasteurizados','Risco de listeriose'],
 ['Álcool','Não existe quantidade segura na gestação'],
 ['Cafeína acima de 200 mg/dia','Cerca de 2 xícaras pequenas de café'],
 ['Adoçantes em excesso e ultraprocessados','Preferir alimentos in natura']
];
function calMeta(){ const t=gest().tri; return t===1?2000:t===2?2340:2450 }
VIEWS.nutricao=()=>{
  const hj=state.refeicoes.filter(r=>r.data===hoje());
  const kcal=hj.reduce((a,r)=>a+(+r.kcal||0),0), meta=calMeta();
  const serie=[];
  for(let i=6;i>=0;i--){const d=iso(addDays(new Date(),-i));
    serie.push({x:DOW[parseISO(d).getDay()],y:state.refeicoes.filter(r=>r.data===d).reduce((a,r)=>a+(+r.kcal||0),0)})}
  return `
  <div class="page-head"><div class="t"><h1>Nutrição</h1><p>Metas do ${TRI_NOME[gest().tri].toLowerCase()}, nutrientes-chave e o que evitar.</p></div>
    <div class="a"><button class="btn btn-primary" id="btnRef">${ic('plus','ic ic-sm')} Registrar refeição</button></div></div>

  <div class="grid g3" style="margin-bottom:18px">
    <div class="card"><div class="card-head"><span class="chip-ic mint">${ic('leaf')}</span><h3>Hoje</h3></div>
      <div class="stat"><div class="v">${kcal}<small> / ${meta} kcal</small></div><div class="d">${hj.length} refeição${hj.length===1?'':'ões'} registrada${hj.length===1?'':'s'}</div></div>
      <div class="bar" style="margin-top:12px"><i style="width:${clamp(kcal/meta*100,0,100)}%;background:linear-gradient(90deg,#8FD08F,#4CAF7D)"></i></div></div>
    <div class="card"><div class="stat"><div class="k">Meta do trimestre</div><div class="v">${meta}<small> kcal</small></div>
      <div class="d">${gest().tri===1?'sem acréscimo calórico':gest().tri===2?'+340 kcal/dia':'+450 kcal/dia'}</div></div></div>
    <div class="card"><div class="stat"><div class="k">Média 7 dias</div><div class="v">${Math.round(serie.reduce((a,s)=>a+s.y,0)/7)}<small> kcal</small></div><div class="d">considerando o que foi registrado</div></div></div>
  </div>

  <div class="grid g-side" style="margin-bottom:18px">
    <div class="card"><div class="card-head"><span class="chip-ic mint">${ic('analytics')}</span><h3>Consumo da semana</h3></div>
      ${chartBars(serie,{h:190,meta,cor:'#7BC48F',un:' kcal'})}
      <p class="hint">A linha tracejada marca a meta diária estimada para o seu trimestre.</p></div>
    <div class="card"><div class="card-head"><span class="chip-ic yellow">${ic('clock')}</span><h3>Refeições de hoje</h3></div>
      ${hj.length?`<div class="list">${hj.map(r=>`<div class="row-item"><div class="body"><b>${esc(r.tipo)}</b><small>${esc(r.desc||'—')}</small></div>
        <span class="tag gray">${r.kcal||0} kcal</span><button class="mini-btn danger" data-delr="${r.id}">${ic('trash','ic ic-sm')}</button></div>`).join('')}</div>`
      :`<div class="empty" style="padding:26px 10px">${ic('leaf')}<h3>Nada registrado hoje</h3><p>Registrar ajuda a perceber padrões junto com os sintomas.</p></div>`}</div>
  </div>

  <div class="card" style="margin-bottom:18px">
    <div class="card-head"><span class="chip-ic pink">${ic('spark')}</span><h3>Nutrientes essenciais na gestação</h3></div>
    <div class="grid g3">
      ${NUTRIENTES.map(n=>`<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:16px">
        <span class="tag ${n[4]}">${esc(n[1])}</span>
        <b style="display:block;font-family:'Poppins';font-size:15px;margin:9px 0 5px">${esc(n[0])}</b>
        <p style="font-size:13px;color:var(--text-2)">${esc(n[2])}</p>
        <p style="font-size:12.5px;color:var(--text-3);margin-top:7px"><b>Fontes:</b> ${esc(n[3])}</p></div>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="chip-ic pink">${ic('bell')}</span><h3>O que evitar</h3></div>
    <div class="list">${EVITAR.map(e=>`<div class="row-item"><span class="chip-ic pink">${ic('x')}</span>
      <div class="body"><b>${esc(e[0])}</b><small>${esc(e[1])}</small></div></div>`).join('')}</div>
    <p class="hint">Orientações gerais. Seu obstetra ou nutricionista pode ajustar tudo isso ao seu caso.</p>
  </div>`;
};
BIND.nutricao=()=>{
  $('#btnRef').onclick=()=>modalRefeicao();
  $$('[data-delr]').forEach(b=>b.onclick=()=>{state.refeicoes=state.refeicoes.filter(r=>r.id!==b.dataset.delr);save();repaint()});
};
function modalRefeicao(){
  openModal({title:'Registrar refeição',icon:'leaf',cor:'mint',
    body:`<div class="field"><label>Refeição</label><select class="input" id="rT">${REFEICOES.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="field"><label>O que você comeu</label><textarea class="input" id="rD" style="min-height:84px" placeholder="Ex.: arroz integral, feijão, filé de frango grelhado e salada"></textarea></div>
      <div class="field-row">
        <div class="field"><label>Calorias estimadas</label><input class="input" type="number" id="rK" placeholder="Ex.: 520"></div>
        <div class="field"><label>Data</label><input class="input" type="date" id="rDt" value="${hoje()}"></div></div>`,
    ok:'Registrar',
    onOk:()=>{
      state.refeicoes.push({id:uid(),tipo:$('#rT').value,desc:$('#rD').value.trim(),kcal:+$('#rK').value||0,data:$('#rDt').value});
      save(); repaint(); toast('Refeição registrada');
    }});
}
</script>

<script>
/* ============================== ÁGUA ============================== */
ADD_LABEL.agua='Registrar água';
const COPOS=[[100,'Gole'],[200,'Copo'],[300,'Caneca'],[500,'Garrafa'],[750,'Squeeze']];
VIEWS.agua=()=>{
  const ml=aguaHoje(), meta=state.metaAgua, pct=clamp(ml/meta*100,0,100);
  const serie=[];
  for(let i=6;i>=0;i--){const d=iso(addDays(new Date(),-i));
    serie.push({x:DOW[parseISO(d).getDay()],y:state.agua[d]||0,cor:(state.agua[d]||0)>=meta?'#7BC48F':'#7FB6EC'})}
  const media=Math.round(serie.reduce((a,s)=>a+s.y,0)/7);
  const diasOk=serie.filter(s=>s.y>=meta).length;
  return `
  <div class="page-head"><div class="t"><h1>Água</h1><p>Na gestação o volume sanguíneo aumenta cerca de 45% — hidratação deixa de ser detalhe.</p></div>
    <div class="a"><button class="btn btn-ghost" id="btnMeta">${ic('settings','ic ic-sm')} Meta: ${(meta/1000).toFixed(1)} L</button></div></div>

  <div class="grid g-side" style="margin-bottom:18px">
    <div class="card">
      <div class="water-wrap">
        <div class="glass-vis">
          <div class="glass-body"><div class="glass-fill" id="glassFill" style="height:${pct}%"></div></div>
          <div class="glass-lbl"><div><b>${(ml/1000).toFixed(2)} L</b><span>${Math.round(pct)}% da meta</span></div></div>
        </div>
        <div style="flex:1;min-width:250px">
          <h3 style="margin-bottom:4px">${ml>=meta?'Meta batida hoje':'Faltam '+(meta-ml)+' ml'}</h3>
          <p style="font-size:13.5px;color:var(--text-2);margin-bottom:16px">Toque em uma medida para somar ao dia.</p>
          <div class="cup-grid">
            ${COPOS.map(c=>`<button class="cup" data-add="${c[0]}">${ic('drop')}<span>${c[0]} ml</span><span style="font-weight:400;font-size:10.5px;color:var(--text-3)">${c[1]}</span></button>`).join('')}
          </div>
          <div style="display:flex;gap:9px;margin-top:14px">
            <button class="btn btn-soft btn-sm" data-add="-200">Desfazer 200 ml</button>
            <button class="btn btn-soft btn-sm" id="btnZerar">Zerar dia</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;gap:14px">
      ${ringHTML(pct,Math.round(pct)+'%','hidratação')}
      <div class="list" style="width:100%">
        ${infoRow('Média 7 dias',media+' ml','considerando todos os dias')}
        ${infoRow('Dias na meta',diasOk+'/7','últimos 7 dias')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="chip-ic blue">${ic('analytics')}</span><h3>Últimos 7 dias</h3></div>
    ${chartBars(serie,{h:200,meta,un:' ml'})}
    <p class="hint">Barras verdes indicam dias em que a meta foi atingida.</p>

};
BIND.agua=()=>{
  $$('[data-add]').forEach(b=>b.onclick=e=>{
    const v=+b.dataset.add, d=hoje();
    state.agua[d]=Math.max(0,(state.agua[d]||0)+v);
    save();
    const r=b.getBoundingClientRect();
    if(v>0){ const ml=state.agua[d];
      if(ml>=state.metaAgua && ml-v<state.metaAgua){ confetti(r.left+r.width/2,r.top); toast('Meta de hidratação atingida'); }
    }
    repaint();
  });
  $('#btnZerar').onclick=()=>{ delete state.agua[hoje()]; save(); repaint(); toast('Registro do dia zerado'); };
  $('#btnMeta').onclick=()=>openModal({title:'Meta diária de água',icon:'drop',cor:'blue',
    body:`<div class="field"><label>Meta (ml)</label><input class="input" type="number" id="mMeta" value="${state.metaAgua}" step="100" min="1000" max="5000"></div>

    ok:'Salvar meta',onOk:()=>{ state.metaAgua=clamp(+$('#mMeta').value||2500,500,6000); save(); repaint(); toast('Meta atualizada'); }});
};

/* ============================== MOVIMENTOS E CHUTES ============================== */
ADD_LABEL.movimentos='Contar chutes';
let sessaoAtiva=null;
VIEWS.movimentos=()=>{
  const g=gest();
  const hj=state.chutes.filter(c=>c.data===hoje());
  const total=hj.reduce((a,c)=>a+c.n,0);
  const s=state.chutes.find(x=>x.id===sessaoAtiva);

  for(let i=6;i>=0;i--){const d=iso(addDays(new Date(),-i));
    serie.push({x:DOW[parseISO(d).getDay()],y:state.chutes.filter(c=>c.data===d).reduce((a,c)=>a+c.n,0)})}
  const hist=[...state.chutes].sort((a,b)=>(b.data+b.inicio).localeCompare(a.data+a.inicio)).slice(0,10);
  return `
  <div class="page-head"><div class="t"><h1>Movimentos e Chutes</h1>
    <p>${g.w>=28?'A partir da semana 28 recomenda-se contar 10 movimentos em até 2 horas, no mesmo horário do dia.':'A contagem formal costuma começar na semana 28 — mas você já pode registrar o que sentir.'}</p></div></div>

  <div class="grid g-side" style="margin-bottom:18px">
    <div class="card" style="text-align:center">
      <button class="kick-pad" id="kickPad">
        <div><b id="kickN">${s?s.n:0}</b><span>${s?'movimentos nesta sessão':'toque a cada movimento'}</span></div>
      </button>
      <div style="display:flex;gap:9px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <button class="btn btn-soft btn-sm" id="kickNova">${ic('plus','ic ic-sm')} Nova sessão</button>
        ${s?`<button class="btn btn-soft btn-sm" id="kickFim">${ic('check','ic ic-sm')} Encerrar sessão</button>`:''}
      </div>
      ${s?`<p class="hint" style="margin-top:12px">Sessão iniciada às ${s.inicio}${s.n>=10?' · meta de 10 movimentos atingida':''}</p>`:''}
    </div>
    <div class="card">
      <div class="card-head"><span class="chip-ic lilac">${ic('waves')}</span><h3>Hoje</h3></div>
      <div class="stat" style="margin-bottom:14px"><div class="v">${total}<small> movimentos</small></div><div class="d">${hj.length} sessão${hj.length===1?'':'ões'} registrada${hj.length===1?'':'s'}</div></div>
      <div class="bar"><i style="width:${clamp(total/10*100,0,100)}%"></i></div>
      <hr class="divider">
      <p style="font-size:13.5px;color:var(--text-2)">Se perceber <b>redução importante</b> no padrão habitual de movimentos, deite do lado esquerdo, beba algo gelado e conte por 2 horas. Se não atingir 10 movimentos, procure a maternidade.</p>
    </div>
  </div>

  <div class="grid g-side">
    <div class="card"><div class="card-head"><span class="chip-ic blue">${ic('analytics')}</span><h3>Movimentos por dia</h3></div>

    <div class="card"><div class="card-head"><span class="chip-ic yellow">${ic('clock')}</span><h3>Sessões recentes</h3></div>
      ${hist.length?`<div class="list">${hist.map(c=>`<div class="row-item">
        <span class="chip-ic ${c.n>=10?'mint':'gray'}" style="${c.n>=10?'':'background:var(--surface-3);color:var(--text-3)'}">${ic('waves')}</span>
        <div class="body"><b>${c.n} movimento${c.n===1?'':'s'}</b><small>${fmtShort(c.data)} · ${c.inicio}${c.fim&&c.fim!==c.inicio?'–'+c.fim:''}</small></div>
        <button class="mini-btn danger" data-delk="${c.id}">${ic('trash','ic ic-sm')}</button></div>`).join('')}</div>`
      :`<div class="empty" style="padding:26px 10px">${ic('waves')}<h3>Nenhuma sessão ainda</h3><p>Toque no painel a cada movimento que sentir.</p></div>`}</div>
  </div>`;
};
BIND.movimentos=()=>{
  const kp=$('#kickPad');
  kp.onclick=e=>{
    const now=new Date();
    let s=state.chutes.find(x=>x.id===sessaoAtiva);
    if(!s || Date.now()-s.ts>2*3600e3 || s.data!==hoje()){
      s={id:uid(),data:hoje(),ts:Date.now(),inicio:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,n:0};
      state.chutes.push(s); sessaoAtiva=s.id;
    }
    s.n++; s.ts=Date.now();
    s.fim=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    save();
    $('#kickN').textContent=s.n;
    const r=kp.getBoundingClientRect();
    const rip=document.createElement('span'); rip.className='rip';
    rip.style.left=(e.clientX-r.left)+'px'; rip.style.top=(e.clientY-r.top)+'px';
    rip.style.width='40px'; rip.style.height='40px';
    kp.appendChild(rip); setTimeout(()=>rip.remove(),750);
    heartPop(e.clientX,e.clientY);
    if(s.n===10){ confetti(r.left+r.width/2,r.top+40); toast('10 movimentos registrados — ótimo sinal'); }
  };
  $('#kickNova').onclick=()=>{ sessaoAtiva=null; repaint(); toast('Nova sessão iniciada ao primeiro toque'); };
  if($('#kickFim')) $('#kickFim').onclick=()=>{ sessaoAtiva=null; repaint(); toast('Sessão encerrada'); };
  $$('[data-delk]').forEach(b=>b.onclick=()=>{state.chutes=state.chutes.filter(c=>c.id!==b.dataset.delk);save();repaint()});
};

/* ============================== MEMÓRIAS (DIÁRIO) ============================== */
ADD_LABEL.memorias='Nova memória';
const HUMORES=['😊','🥰','😴','🤢','😢','😤','🤩','😌'];
const HUMOR_NOME={'😊':'Feliz','🥰':'Amada','😴':'Cansada','🤢':'Enjoada','😢':'Sensível','😤':'Irritada','🤩':'Animada','😌':'Tranquila'};
let filtroMem='todos';
VIEWS.memorias=()=>{
  let lista=[...state.entries].sort((a,b)=>b.data.localeCompare(a.data));
  if(filtroMem==='fotos') lista=lista.filter(e=>e.foto);
  else if(filtroMem!=='todos') lista=lista.filter(e=>e.humor===filtroMem);
  const humores=Object.entries(state.entries.reduce((a,e)=>(e.humor&&(a[e.humor]=(a[e.humor]||0)+1),a),{})).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="page-head"><div class="t"><h1>Memórias</h1><p>Seu diário da gestação — texto, humor e fotos guardados só no seu dispositivo.</p></div>
    <div class="a"><button class="btn btn-primary" id="btnNovaMem">${ic('plus','ic ic-sm')} Nova memória</button></div></div>

  <div class="grid g4" style="margin-bottom:18px">
    <div class="card"><div class="stat"><div class="k">Registros</div><div class="v">${state.entries.length}</div><div class="d">na sua linha do tempo</div></div></div>
    <div class="card"><div class="stat"><div class="k">Com foto</div><div class="v">${state.entries.filter(e=>e.foto).length}</div><div class="d">momentos guardados</div></div></div>
    <div class="card"><div class="stat"><div class="k">Humor mais comum</div><div class="v" style="font-size:26px">${humores[0]?humores[0][0]+' '+HUMOR_NOME[humores[0][0]]:'—'}</div><div class="d">${humores[0]?humores[0][1]+' registros':'sem dados'}</div></div></div>
    <div class="card"><div class="stat"><div class="k">Semana atual</div><div class="v">${gest().w}</div><div class="d">${state.entries.filter(e=>diasEntre(e.data,hoje())<7).length} registros nos últimos 7 dias</div></div></div>
  </div>

  <div class="seg" style="margin-bottom:18px;max-width:640px">
    <button class="${filtroMem==='todos'?'on':''}" data-fm="todos">Todas</button>
    <button class="${filtroMem==='fotos'?'on':''}" data-fm="fotos">Com foto</button>
    ${HUMORES.slice(0,5).map(h=>`<button class="${filtroMem===h?'on':''}" data-fm="${h}">${h}</button>`).join('')}
  </div>

  ${lista.length?`<div class="mem-grid">${lista.map(memCard).join('')}</div>`
   :`<div class="card"><div class="empty">${ic('image')}<h3>Nenhuma memória por aqui</h3>
      <p>Escreva sobre hoje: como você se sentiu, o que o bebê aprontou, o que você quer lembrar daqui a dez anos.</p>
      <button class="btn btn-primary" id="btnNovaMem2">${ic('plus','ic ic-sm')} Criar memória</button></div></div>`}`;
};
const memCard=e=>`<article class="mem" data-mem="${e.id}">
  <div class="mem-photo">${e.foto?`<img src="${e.foto}" alt="">`:`<div class="ph">${ic('image','ic ic-lg')}</div>`}</div>
  <div class="mem-body"><span class="m">${e.humor||''}</span>
    <b>${fmt(e.data)}${e.semana?` · semana ${e.semana}`:''}</b>
    <p>${esc(e.titulo?e.titulo+' — ':'')}${esc(e.texto||'')}</p></div></article>`;
BIND.memorias=()=>{
  const abrir=()=>modalMemoria();
  $('#btnNovaMem').onclick=abrir;
  if($('#btnNovaMem2')) $('#btnNovaMem2').onclick=abrir;
  $$('[data-fm]').forEach(b=>b.onclick=()=>{filtroMem=b.dataset.fm;repaint()});
  $$('[data-mem]').forEach(c=>c.onclick=()=>{
    const e=state.entries.find(x=>x.id===c.dataset.mem);
    openModal({title:fmt(e.data),icon:'image',cor:'pink',ok:'',cancel:'Fechar',
      body:`${e.foto?`<img src="${e.foto}" style="width:100%;border-radius:16px;margin-bottom:14px" alt="">`:''}
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
          ${e.humor?`<span style="font-size:26px">${e.humor}</span><span class="tag pink">${HUMOR_NOME[e.humor]||''}</span>`:''}
          ${e.semana?`<span class="tag lilac">Semana ${e.semana}</span>`:''}</div>
        ${e.titulo?`<h3 style="margin-bottom:8px">${esc(e.titulo)}</h3>`:''}
        <p style="white-space:pre-wrap;color:var(--text-2);line-height:1.75">${esc(e.texto||'')}</p>
        <hr class="divider">
        <button class="btn btn-soft btn-block btn-sm" id="delMem">${ic('trash','ic ic-sm')} Excluir memória</button>`});
    setTimeout(()=>{const d=$('#delMem'); if(d) d.onclick=()=>{
      state.entries=state.entries.filter(x=>x.id!==e.id); save(); closeModal(); repaint(); toast('Memória removida');
    }},60);
  });
};
function modalMemoria(){
  openModal({title:'Nova memória',icon:'image',cor:'pink',
    body:`<div class="field"><label>Como você está se sentindo?</label>
        <div class="moods" id="mHumor">${HUMORES.map((h,i)=>`<button class="mood${i===0?' on':''}" data-h="${h}" title="${HUMOR_NOME[h]}">${h}</button>`).join('')}</div></div>
      <div class="field-row">
        <div class="field"><label>Data</label><input class="input" type="date" id="mD" value="${hoje()}"></div>
        <div class="field"><label>Título</label><input class="input" id="mT" placeholder="Ex.: primeiro chute"></div></div>
      <div class="field"><label>O que você quer lembrar deste dia?</label>
        <textarea class="input" id="mTx" placeholder="Escreva livremente…"></textarea></div>
      <div class="field"><label>Foto (opcional)</label>
        <input type="file" id="mF" accept="image/*" style="display:none">
        <button class="btn btn-soft btn-block" id="mFBtn">${ic('camera','ic ic-sm')} Escolher foto</button>
        <div id="mPrev" style="margin-top:10px"></div></div>`,
    ok:'Salvar memória',
    onOk:()=>{
      const txt=$('#mTx').value.trim();
      if(!txt && !fotoTmp){ toast('Escreva algo ou adicione uma foto','warn'); return false; }
      state.entries.push({id:uid(),data:$('#mD').value,titulo:$('#mT').value.trim(),texto:txt,
        humor:$('#mHumor .on')?.dataset.h||'',foto:fotoTmp,semana:gest().w});
      save();
      const c={x:innerWidth/2,y:innerHeight/2};
      heartPop(c.x,c.y); confetti(c.x,c.y);
      fotoTmp=null; repaint(); toast('Memória guardada');
    }});
  fotoTmp=null;
  $$('#mHumor .mood').forEach(b=>b.onclick=()=>{$$('#mHumor .mood').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  $('#mFBtn').onclick=()=>$('#mF').click();
  $('#mF').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    comprimir(f,d=>{ fotoTmp=d; $('#mPrev').innerHTML=`<img src="${d}" style="width:100%;border-radius:14px" alt="">`; });
  };
}
let fotoTmp=null;
function comprimir(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=720, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
</script>

<script>

 '1º trimestre (1–13 semanas)':[

VIEWS.checklist=()=>{
  const custom=state.checklistCustom;
  const todos=[...Object.values(CHECKLIST).flat(),...custom.map(c=>c.t)];
  const feitos=todos.filter(t=>state.checklist[t]).length;

    <div class="a"><button class="btn btn-primary" id="btnAddCheck">${ic('plus','ic ic-sm')} Item personalizado</button></div></div>

  <div class="card" style="margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      ${ringHTML(pct,pct+'%','concluído')}
      <div style="flex:1;min-width:220px">
        <h3>${feitos} de ${todos.length} itens concluídos</h3>
        <p style="font-size:13.5px;color:var(--text-2);margin-top:4px">Você está no ${TRI_NOME[triAtual].toLowerCase()} — foque nos itens desse bloco primeiro.</p>
        <div class="bar" style="margin-top:14px"><i style="width:${pct}%"></i></div>
      </div>
    </div>
  </div>

  <div class="grid g3">

        <div class="card-head"><span class="chip-ic ${['pink','mint','blue'][idx]}">${ic('checklist')}</span>
          <h3 style="font-size:15px">${titulo}<div class="sub">${f}/${itens.length} concluídos</div></h3>
          ${atual?'<span class="tag pink">atual</span>':''}</div>
        <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(f/itens.length*100)}%"></i></div>
        <div class="list">${itens.map(t=>chkItem(t)).join('')}</div></div>`;
    }).join('')}
  </div>

  ${custom.length?`<div class="card" style="margin-top:18px">
    <div class="card-head"><span class="chip-ic lilac">${ic('star')}</span><h3>Seus itens</h3></div>
    <div class="list">${custom.map((c,i)=>`
      <label class="chk"><input type="checkbox" data-chk="${esc(c.t)}"${state.checklist[c.t]?' checked':''}>
        <span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
        <span class="txt">${esc(c.t)}</span>
        <button class="mini-btn danger" data-delchk="${i}">${ic('trash','ic ic-sm')}</button></label>`).join('')}</div></div>`:''}`;
};
const chkItem=t=>`<label class="chk"><input type="checkbox" data-chk="${esc(t)}"${state.checklist[t]?' checked':''}>
  <span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>

BIND.checklist=()=>{

    if(c.checked){ const r=c.getBoundingClientRect(); confetti(r.left+30,r.top); }
    updateSidebarProgress();

  $$('[data-delchk]').forEach(b=>b.onclick=e=>{e.preventDefault();state.checklistCustom.splice(+b.dataset.delchk,1);save();repaint()});

    body:`<div class="field"><label>Descrição</label><input class="input" id="ckT" placeholder="Ex.: comprar bolsa térmica"></div>`,
    ok:'Adicionar',onOk:()=>{
      const t=$('#ckT').value.trim(); if(!t) return false;
      state.checklistCustom.push({t}); save(); repaint(); toast('Item adicionado');
    }});
};

/* ============================== MALA DA MATERNIDADE ============================== */
ADD_LABEL.mala='Novo item';
const MALA={
 'Documentos':['RG e CPF','Cartão do plano de saúde','Cartão da gestante / pré-natal','Exames recentes','Plano de parto impresso','Certidão de casamento ou união'],
 'Para você':['4 camisolas com abertura frontal','Robe ou casaco leve','5 calcinhas confortáveis','2 sutiãs de amamentação','Absorventes pós-parto','Chinelo antiderrapante','Meias','Necessaire completa','Hidratante labial','Elástico de cabelo','Roupa para a alta','Travesseiro próprio'],
 'Para o bebê':['6 bodies de manga curta e longa','6 macacões / mijões','Meias e luvinhas','2 toucas','Manta e cueiro','Fraldas RN e P','Lenços umedecidos','Pomada de assadura','Toalha com capuz','Roupa da alta','Cobertor'],
 'Acompanhante':['Roupa confortável para 2 dias','Lanches e garrafa de água','Carregador de celular','Documentos pessoais','Travesseiro','Dinheiro para estacionamento'],
 'Extras':['Cadeirinha instalada no carro','Câmera ou celular com espaço livre','Fone de ouvido e playlist','Lista de contatos importantes','Caderno para anotações']
};
VIEWS.mala=()=>{
  const custom=state.malaCustom;
  const todos=[...Object.values(MALA).flat(),...custom.map(c=>c.t)];
  const feitos=todos.filter(t=>state.mala[t]).length;
  const pct=todos.length?Math.round(feitos/todos.length*100):0;
  const g=gest();
  return `
  <div class="page-head"><div class="t"><h1>Mala da Maternidade</h1>
    <p>${g.w>=32?'Recomenda-se ter a mala pronta a partir da semana 32 — você já está nessa fase.':`Deixe pronta por volta da semana 32 — faltam ${Math.max(0,32-g.w)} semanas.`}</p></div>
    <div class="a">
      <button class="btn btn-ghost" id="btnImprimir">${ic('download','ic ic-sm')} Imprimir lista</button>
      <button class="btn btn-primary" id="btnAddMala">${ic('plus','ic ic-sm')} Novo item</button></div></div>

  <div class="card" style="margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      ${ringHTML(pct,pct+'%','pronta')}
      <div style="flex:1;min-width:220px">
        <h3>${feitos} de ${todos.length} itens separados</h3>
        <p style="font-size:13.5px;color:var(--text-2);margin-top:4px">${pct===100?'Sua mala está completa. Deixe perto da porta.':'Vá marcando conforme separa cada item.'}</p>
        <div class="bar" style="margin-top:14px"><i style="width:${pct}%"></i></div>
      </div>
    </div>
  </div>

  <div class="grid g2">
    ${Object.entries(MALA).map(([cat,itens],idx)=>{
      const f=itens.filter(t=>state.mala[t]).length;
      return `<div class="card">
        <div class="card-head"><span class="chip-ic ${['blue','pink','yellow','mint','lilac'][idx%5]}">${ic('bag')}</span>
          <h3>${cat}<div class="sub">${f}/${itens.length} separados</div></h3></div>
        <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(f/itens.length*100)}%"></i></div>
        <div class="list">${itens.map(t=>`<label class="chk"><input type="checkbox" data-mala="${esc(t)}"${state.mala[t]?' checked':''}>
          <span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="txt">${esc(t)}</span></label>`).join('')}</div></div>`;
    }).join('')}
    ${custom.length?`<div class="card"><div class="card-head"><span class="chip-ic lilac">${ic('star')}</span><h3>Seus itens<div class="sub">${custom.filter(c=>state.mala[c.t]).length}/${custom.length}</div></h3></div>
      <div class="list">${custom.map((c,i)=>`<label class="chk"><input type="checkbox" data-mala="${esc(c.t)}"${state.mala[c.t]?' checked':''}>
        <span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="txt">${esc(c.t)}</span>
        <button class="mini-btn danger" data-delmala="${i}">${ic('trash','ic ic-sm')}</button></label>`).join('')}</div></div>`:''}
  </div>`;
};
BIND.mala=()=>{
  $$('[data-mala]').forEach(c=>c.onchange=()=>{
    state.mala[c.dataset.mala]=c.checked; save();
    if(c.checked){const r=c.getBoundingClientRect();confetti(r.left+30,r.top)}
  });
  $$('[data-delmala]').forEach(b=>b.onclick=e=>{e.preventDefault();state.malaCustom.splice(+b.dataset.delmala,1);save();repaint()});
  $('#btnAddMala').onclick=()=>openModal({title:'Novo item da mala',icon:'bag',cor:'blue',
    body:`<div class="field"><label>Item</label><input class="input" id="mlT" placeholder="Ex.: chá de camomila"></div>`,
    ok:'Adicionar',onOk:()=>{const t=$('#mlT').value.trim();if(!t)return false;state.malaCustom.push({t});save();repaint();toast('Item adicionado')}});
  $('#btnImprimir').onclick=()=>window.print();
};

/* ============================== PLANO DE PARTO ============================== */
ADD_LABEL.parto='Salvar plano';
const PLANO=[
 {id:'tipo',t:'Tipo de parto desejado',ops:['Normal','Cesárea','Normal, com cesárea se necessário','Ainda decidindo']},
 {id:'ambiente',t:'Ambiente da sala',ops:['Luz baixa e silêncio','Música da minha playlist','Sem preferência']},
 {id:'acompanhante',t:'Acompanhante',ops:['Parceiro(a)','Mãe / familiar','Doula','Parceiro(a) e doula']},
 {id:'analgesia',t:'Alívio da dor',ops:['Analgesia peridural','Métodos naturais primeiro','Somente se eu pedir','Decidir no momento']},
 {id:'movimento',t:'Liberdade de movimento',ops:['Quero caminhar e trocar de posição','Prefiro ficar no leito','Sem preferência']},
 {id:'episiotomia',t:'Episiotomia',ops:['Somente se for indispensável','Prefiro evitar','Deixo a critério médico']},
 {id:'cordao',t:'Corte do cordão',ops:['Clampeamento tardio','Acompanhante corta o cordão','Padrão da equipe']},
 {id:'pele',t:'Contato pele a pele',ops:['Imediato e prolongado','Assim que possível','Sem preferência']},
 {id:'amamentacao',t:'Amamentação',ops:['Na primeira hora','Quero apoio de consultora','Vou usar fórmula','Ainda decidindo']},
 {id:'fotos',t:'Registro do nascimento',ops:['Quero fotos e vídeo','Somente fotos','Sem registro']}
];
VIEWS.parto=()=>{
  const p=state.plano, preenchidos=PLANO.filter(q=>p[q.id]).length;
  return `
  <div class="page-head"><div class="t"><h1>Plano de Parto</h1>
    <p>Um documento com suas preferências para levar à maternidade. Nada aqui é definitivo — a equipe adapta conforme a segurança de vocês dois.</p></div>
    <div class="a"><button class="btn btn-ghost" id="btnPlanoPrint">${ic('download','ic ic-sm')} Imprimir</button>
      <button class="btn btn-primary" id="btnPlanoResumo">${ic('spark','ic ic-sm')} Gerar documento</button></div></div>

  <div class="card" style="margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      ${ringHTML(preenchidos/PLANO.length*100,preenchidos+'/'+PLANO.length,'respondido')}
      <div style="flex:1;min-width:230px">
        <h3>${preenchidos===PLANO.length?'Plano completo':'Continue de onde parou'}</h3>
        <p style="font-size:13.5px;color:var(--text-2);margin-top:4px">Suas respostas são salvas automaticamente. Leve o documento impresso e converse com seu obstetra antes.</p>
      </div>
    </div>
  </div>

  <div class="grid g2" style="margin-bottom:18px">
    ${PLANO.map((q,i)=>`<div class="card">
      <div class="card-head"><span class="chip-ic ${['pink','mint','blue','lilac','yellow'][i%5]}">${ic('plan')}</span><h3 style="font-size:15px">${q.t}</h3></div>
      <div class="list">${q.ops.map(o=>`
        <label class="chk"><input type="radio" name="pl_${q.id}" data-plano="${q.id}" value="${esc(o)}"${p[q.id]===o?' checked':''}>
          <span class="box" style="border-radius:99px"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
          <span class="txt" style="text-decoration:none!important;color:var(--text)!important">${esc(o)}</span></label>`).join('')}</div>
    </div>`).join('')}
  </div>

  <div class="card">
    <div class="card-head"><span class="chip-ic lilac">${ic('edit')}</span><h3>Observações livres</h3></div>
    <textarea class="input" id="plObs" style="min-height:130px" placeholder="Alergias, medos, pedidos específicos, quem pode entrar na sala…">${esc(p.obs||'')}</textarea>
    <p class="hint">Ex.: alergias medicamentosas, preferência por não receber visitas logo após o parto, desejo de guardar a placenta.</p>
  </div>`;
};
BIND.parto=()=>{
  $$('[data-plano]').forEach(r=>r.onchange=()=>{ state.plano[r.dataset.plano]=r.value; save(); updateSidebarProgress(); });
  $('#plObs').onblur=()=>{ state.plano.obs=$('#plObs').value; save(); };
  $('#btnPlanoPrint').onclick=()=>window.print();
  $('#btnPlanoResumo').onclick=async()=>{
    await aiRun('Montando seu plano de parto','Organizando preferências em um documento claro',
      ['Lendo suas respostas','Agrupando por etapa do parto','Redigindo em linguagem objetiva','Formatando o documento']);
    const p=state.plano;
    const linhas=PLANO.filter(q=>p[q.id]).map(q=>`<div class="row-item"><div class="body"><b>${q.t}</b><small>${esc(p[q.id])}</small></div></div>`).join('');
    openModal({title:'Plano de parto',icon:'plan',cor:'lilac',ok:'',cancel:'Fechar',
      body:`<p style="font-size:14px;color:var(--text-2);margin-bottom:14px">Gestante: <b>${esc(state.profile.nome||'—')}</b> · Semana ${gest().w} · DPP ${fmt(state.profile.dpp)}
        ${state.profile.medico?`<br>Obstetra: ${esc(state.profile.medico)}`:''}${state.profile.hospital?`<br>Maternidade: ${esc(state.profile.hospital)}`:''}</p>
        ${linhas||'<p style="color:var(--text-3)">Nenhuma preferência marcada ainda.</p>'}
        ${p.obs?`<hr class="divider"><b style="font-family:'Poppins';font-size:14px">Observações</b><p style="white-space:pre-wrap;color:var(--text-2);margin-top:6px">${esc(p.obs)}</p>`:''}
        <hr class="divider"><p class="hint">Documento gerado pelo Diário da Gestação. As decisões finais durante o parto seguem a avaliação clínica da equipe.</p>`});
  };
};
</script>

<style>

  .sidebar,.topbar,.bottomnav,.scrim,.toasts,.ai-overlay,.nprogress,.page-head .a,.row-actions,.mini-btn{display:none!important}

<script>
/* ============================== DICAS ============================== */
ADD_LABEL.dicas='Nova memória';
const ARTIGOS=[
 {c:'Saúde',cor:'pink',t:'Sinais de alerta que pedem ida ao hospital',d:'Sangramento vaginal, dor de cabeça forte com visão turva, febre acima de 38 °C, perda de líquido, dor abdominal intensa e redução dos movimentos do bebê.',
  txt:'Alguns sintomas nunca devem esperar a próxima consulta. Procure atendimento imediatamente se notar: sangramento vaginal de qualquer volume; perda de líquido claro pela vagina; dor de cabeça forte e persistente, principalmente acompanhada de visão turva, luzes piscando ou inchaço súbito no rosto e mãos (sinais de pré-eclâmpsia); febre acima de 38 °C; dor abdominal intensa e contínua; contrações regulares antes de 37 semanas; e redução importante nos movimentos do bebê depois da 28ª semana.\n\nNa dúvida, ligue para a maternidade. Nenhuma equipe considera exagero uma gestante que procura ajuda — o custo de esperar é sempre maior.',t2:'6 min de leitura'},
 {c:'Nutrição',cor:'mint',t:'O prato ideal na gestação',d:'Metade de vegetais, um quarto de proteína, um quarto de carboidrato integral — e uma fonte de gordura boa.',
  txt:'Não existe dieta única, mas há um desenho de prato que funciona bem: metade preenchida por legumes e verduras variadas, um quarto por proteína (ovo, frango, peixe, carne magra ou leguminosas) e um quarto por carboidrato integral (arroz integral, batata-doce, mandioca, quinoa). Complete com uma fonte de gordura boa: azeite, abacate, castanhas.\n\nNo primeiro trimestre não é preciso aumentar calorias. No segundo, cerca de +340 kcal por dia; no terceiro, +450 kcal. Isso equivale a um lanche reforçado, não a "comer por dois". Fracionar em 5 a 6 refeições reduz enjoo e azia.',t2:'5 min de leitura'},
 {c:'Bem-estar',cor:'lilac',t:'Como dormir melhor no terceiro trimestre',d:'Posição lateral esquerda, travesseiro entre as pernas e rotina noturna previsível fazem mais diferença do que qualquer suplemento.',
  txt:'A partir da segunda metade da gestação, dormir de lado — preferencialmente do lado esquerdo — melhora o fluxo sanguíneo para a placenta. Um travesseiro entre os joelhos e outro apoiando a barriga reduzem a tensão lombar.\n\nEvite líquidos em grande volume nas duas horas antes de deitar (sem cortar a hidratação do dia), jante mais cedo para diminuir o refluxo e mantenha o quarto escuro e fresco. Se a insônia persistir por semanas, converse com seu obstetra: às vezes ela sinaliza anemia, apneia ou ansiedade que merecem tratamento.',t2:'4 min de leitura'},
 {c:'Exercício',cor:'blue',t:'Atividade física liberada por trimestre',d:'Caminhada, hidroginástica, yoga adaptada e musculação leve são seguras na maioria das gestações sem intercorrências.',
  txt:'A recomendação geral é de 150 minutos semanais de atividade moderada. Caminhada, natação, hidroginástica, bicicleta ergométrica, yoga e pilates adaptados e musculação com carga leve costumam ser liberados.\n\nEvite esportes de contato, atividades com risco de queda (equitação, esqui), mergulho e exercícios em decúbito dorsal prolongado após o segundo trimestre. O teste da fala é um bom termômetro: se você consegue conversar durante o exercício, a intensidade está adequada. Pare imediatamente diante de sangramento, tontura, dor no peito ou contrações.',t2:'5 min de leitura'},
 {c:'Saúde',cor:'pink',t:'Vacinas recomendadas na gravidez',d:'dTpa a partir de 20 semanas, influenza em qualquer idade gestacional, hepatite B e covid-19 conforme calendário.',
  txt:'A dTpa (difteria, tétano e coqueluche) é indicada a cada gestação, a partir da 20ª semana, e protege o recém-nascido contra coqueluche nos primeiros meses. A vacina da gripe pode ser aplicada em qualquer idade gestacional e reduz complicações respiratórias.\n\nHepatite B é indicada para quem não completou o esquema. Vacinas de vírus vivo atenuado, como tríplice viral e febre amarela, são contraindicadas de rotina — cada caso deve ser avaliado. Leve sempre a carteira de vacinação ao pré-natal.',t2:'4 min de leitura'},
 {c:'Bem-estar',cor:'yellow',t:'Saúde mental também é pré-natal',d:'Ansiedade e tristeza persistentes na gestação são comuns e tratáveis — e não significam que você será uma mãe pior.',
  txt:'Cerca de uma em cada cinco gestantes apresenta sintomas significativos de ansiedade ou depressão. Oscilação de humor pontual é esperada; o alerta acontece quando tristeza, desinteresse, culpa ou preocupação constante duram mais de duas semanas e atrapalham o dia.\n\nFale com seu obstetra sem medo de julgamento. Psicoterapia é a primeira linha e, quando necessário, existem medicamentos com bom perfil de segurança na gestação. Rede de apoio, sono e atividade física têm efeito real — não são conselho vazio.',t2:'6 min de leitura'}
];
const MIDIA=[
 {tipo:'Vídeo',t:'O que acontece em cada trimestre',d:'Um panorama visual do desenvolvimento do bebê, da concepção ao nascimento.',dur:'18 min',cor:'blue'},
 {tipo:'Podcast',t:'Conversas sobre parto humanizado',d:'Obstetras e doulas explicam o que é e o que não é parto humanizado.',dur:'42 min',cor:'lilac'},
 {tipo:'Vídeo',t:'Exercícios seguros na gestação',d:'Sequência guiada de 20 minutos, adaptável a todos os trimestres.',dur:'22 min',cor:'mint'},
 {tipo:'Podcast',t:'Amamentação sem culpa',d:'Consultora de amamentação responde às dúvidas mais comuns dos primeiros dias.',dur:'35 min',cor:'pink'}
];
let catDica='Todos';
VIEWS.dicas=()=>{
  const cats=['Todos',...new Set(ARTIGOS.map(a=>a.c))];
  const lista=catDica==='Todos'?ARTIGOS:ARTIGOS.filter(a=>a.c===catDica);
  const g=gest();
  return `
  <div class="page-head"><div class="t"><h1>Dicas</h1><p>Conteúdo curado sobre saúde, nutrição e bem-estar — organizado por tema.</p></div></div>

  <div class="card" style="margin-bottom:18px;background:var(--lilac-soft);border-color:transparent">
    <div style="display:flex;gap:14px;align-items:flex-start">
      <span class="chip-ic lilac" style="background:var(--surface)">${ic('spark')}</span>
      <div><h3>Para a sua semana ${g.w}</h3>
        <p style="font-size:14.5px;color:var(--text-2);margin-top:5px">${esc(dicaSemana(g.w))}</p></div>
    </div>
  </div>

  <div class="seg" style="max-width:520px;margin-bottom:18px">
    ${cats.map(c=>`<button class="${catDica===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}
  </div>

  <div class="grid g2" style="margin-bottom:18px">
    ${lista.map((a,i)=>`<div class="article" data-art="${ARTIGOS.indexOf(a)}">
      <span class="thumb ${a.cor}" style="background:var(--${a.cor}-soft);color:var(--${a.cor}-ink)">${ic('book','ic ic-lg')}</span>
      <div class="body"><b>${esc(a.t)}</b><p>${esc(a.d)}</p>
        <div class="meta"><span class="tag ${a.cor}">${a.c}</span><span>${a.t2}</span></div></div>
    </div>`).join('')}
  </div>

  <div class="card">
    <div class="card-head"><span class="chip-ic blue">${ic('play')}</span><h3>Vídeos e podcasts com especialistas</h3></div>
    <div class="grid g2">
      ${MIDIA.map((m,i)=>`<div class="article" data-mid="${i}">
        <span class="thumb" style="background:var(--${m.cor}-soft);color:var(--${m.cor}-ink)">${ic(m.tipo==='Vídeo'?'play':'mic','ic ic-lg')}</span>
        <div class="body"><b>${esc(m.t)}</b><p>${esc(m.d)}</p>
          <div class="meta"><span class="tag ${m.cor}">${m.tipo}</span><span>${m.dur}</span></div></div></div>`).join('')}
    </div>
  </div>`;
};
function dicaSemana(w){
  if(w<8) return 'Comece o ácido fólico se ainda não começou e evite automedicação. Enjoo costuma piorar entre a 6ª e a 9ª semana — refeições pequenas ajudam mais do que ficar em jejum.';
  if(w<13) return 'É a fase de organizar exames e a primeira ultrassonografia. O cansaço é real: dormir mais não é preguiça, é demanda metabólica.';
  if(w<20) return 'Costuma ser o período mais confortável da gestação. Bom momento para iniciar exercícios liberados e agendar o ultrassom morfológico.';
  if(w<28) return 'Atenção ao teste de tolerância à glicose e à vacina dTpa. Dores lombares aparecem — alongamento e postura fazem diferença.';
  if(w<34) return 'Comece a contar os movimentos do bebê diariamente e finalize a mala da maternidade. Azia e insônia são esperadas nesta fase.';
  return 'Reconheça os sinais de trabalho de parto: contrações regulares que aumentam de intensidade, perda do tampão mucoso e ruptura da bolsa. Mantenha documentos e mala prontos.';
}
BIND.dicas=()=>{
  $$('[data-cat]').forEach(b=>b.onclick=()=>{catDica=b.dataset.cat;repaint()});
  $$('[data-art]').forEach(b=>b.onclick=async()=>{
    const a=ARTIGOS[+b.dataset.art];
    openModal({title:a.t,icon:'book',cor:a.cor,ok:'',cancel:'Fechar',
      body:`<span class="tag ${a.cor}">${a.c}</span><span class="tag gray" style="margin-left:6px">${a.t2}</span>
        <p style="white-space:pre-wrap;color:var(--text-2);line-height:1.8;margin-top:14px">${esc(a.txt)}</p>
        <hr class="divider"><p class="hint">Conteúdo informativo, sem substituir orientação do seu obstetra.</p>`});
  });
  $$('[data-mid]').forEach(b=>b.onclick=()=>{
    const m=MIDIA[+b.dataset.mid];
    openModal({title:m.t,icon:m.tipo==='Vídeo'?'play':'mic',cor:m.cor,ok:'',cancel:'Fechar',
      body:`<div style="aspect-ratio:16/9;border-radius:16px;background:var(--accent-grad);display:grid;place-items:center;color:#3B2E44;margin-bottom:14px">
          <div style="text-align:center">${ic(m.tipo==='Vídeo'?'play':'mic','ic')}<div style="font-family:'Poppins';font-weight:600;margin-top:8px">${m.tipo} · ${m.dur}</div></div></div>
        <p style="color:var(--text-2)">${esc(m.d)}</p>
        <p class="hint" style="margin-top:12px">Este espaço é reservado para a mídia do conteúdo. Conecte aqui o player da sua biblioteca ou plataforma preferida.</p>`});
  });
};

/* ============================== COMUNIDADE ============================== */
ADD_LABEL.comunidade='Publicar';
function seedPosts(){
  const d=n=>iso(addDays(new Date(),-n));
  return [
   {id:uid(),autor:'Camila R.',sem:32,data:d(0),txt:'Alguém mais sente aquele aperto no fim do dia? Minha barriga endurece toda por uns 30 segundos e passa. A obstetra disse que é contração de treinamento, mas confesso que assusta na primeira vez.',likes:12,tag:'3º trimestre'},
   {id:uid(),autor:'Juliana M.',sem:19,data:d(1),txt:'Senti o primeiro chute ontem à noite! Parecia uma borboleta presa. Fiquei uma hora com a mão na barriga esperando de novo. Vale registrar tudo, gente, esses detalhes somem da memória rápido.',likes:34,tag:'2º trimestre'},
   {id:uid(),autor:'Patrícia L.',sem:27,data:d(2),txt:'Dica que salvou meu enjoo: bolacha de água e sal antes de levantar da cama, ainda deitada. Descobri com a minha avó e funcionou melhor que qualquer chá.',likes:47,tag:'Dicas'},

  <div class="list">

        <div style="flex:1"><b>${esc(p.autor)}</b><small>${p.sem?`Semana ${p.sem} · `:''}${fmtShort(p.data)}</small></div>

      <div class="post-foot">
        <button class="like-btn${state.likes[p.id]?' on':''}" data-like="${p.id}">${ic('heart','ic ic-sm')} ${p.likes+(state.likes[p.id]?1:0)}</button>
