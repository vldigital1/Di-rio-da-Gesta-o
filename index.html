<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8BBD0">
<title>Diário da Gestação</title>
<link rel="icon" href="logo_gestacao.jpg-.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DIÁRIO DA GESTAÇÃO — Design System
   ============================================================ */
:root{
  --pink:#F8BBD0; --mint:#A5D6A7; --yellow:#FFF59D; --blue:#BBDEFB; --lilac:#E1BEE7;
  --pink-ink:#C2185B; --mint-ink:#2E7D46; --yellow-ink:#9A7B0A; --blue-ink:#1565C0; --lilac-ink:#7B3FA0;
  --pink-soft:#FDEEF4; --mint-soft:#EDF7EE; --yellow-soft:#FFFBE6; --blue-soft:#EAF3FD; --lilac-soft:#F6EDFA;

  --bg:#F6F4F9;
  --bg-grad:radial-gradient(1200px 600px at 8% -10%, #FDEAF2 0%, transparent 55%),
            radial-gradient(1000px 520px at 100% 0%, #EAF2FD 0%, transparent 50%),
            radial-gradient(900px 600px at 50% 110%, #F3EDFA 0%, transparent 55%);
  --surface:#FFFFFF;
  --surface-2:#FBFAFD;
  --surface-3:#F4F1F8;
  --glass:rgba(255,255,255,.72);
  --sidebar:rgba(255,255,255,.78);

  --text:#221C2A;
  --text-2:#655D72;
  --text-3:#9A93A6;

  --border:rgba(34,28,42,.08);
  --border-2:rgba(34,28,42,.14);

  --shadow-xs:0 1px 2px rgba(34,28,42,.05);
  --shadow-sm:0 2px 8px rgba(34,28,42,.06), 0 1px 2px rgba(34,28,42,.04);
  --shadow-md:0 8px 24px rgba(34,28,42,.08), 0 2px 6px rgba(34,28,42,.04);
  --shadow-lg:0 24px 60px rgba(34,28,42,.14), 0 6px 16px rgba(34,28,42,.06);
  --shadow-glow:0 10px 30px rgba(224,98,155,.28);

  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;

  --sidebar-w:268px;
  --topbar-h:72px;

  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);

  --accent:#E0629B;
  --accent-2:#8E5BC7;
  --accent-grad:linear-gradient(135deg,#F8BBD0 0%,#E1BEE7 48%,#BBDEFB 100%);
  --accent-grad-strong:linear-gradient(135deg,#EE7FAE 0%,#B77BD8 52%,#6FA8E8 100%);
}

[data-theme="dark"]{
  --pink-ink:#F8A5C4; --mint-ink:#94D59B; --yellow-ink:#F0DC85; --blue-ink:#94C4F5; --lilac-ink:#D6A8EC;
  --pink-soft:rgba(248,187,208,.11); --mint-soft:rgba(165,214,167,.11); --yellow-soft:rgba(255,245,157,.10);
  --blue-soft:rgba(187,222,251,.11); --lilac-soft:rgba(225,190,231,.11);

  --bg:#0C0A11;
  --bg-grad:radial-gradient(1200px 600px at 8% -10%, rgba(224,98,155,.16) 0%, transparent 55%),
            radial-gradient(1000px 520px at 100% 0%, rgba(111,168,232,.14) 0%, transparent 50%),
            radial-gradient(900px 600px at 50% 110%, rgba(142,91,199,.16) 0%, transparent 55%);
  --surface:#15111D;
  --surface-2:#1B1626;
  --surface-3:#221C2F;
  --glass:rgba(21,17,29,.72);
  --sidebar:rgba(17,14,24,.82);

  --text:#F2EEF7;
  --text-2:#A79FB5;
  --text-3:#736B81;

  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.15);

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 2px 10px rgba(0,0,0,.4);
  --shadow-md:0 10px 30px rgba(0,0,0,.45);
  --shadow-lg:0 28px 70px rgba(0,0,0,.6);
  --shadow-glow:0 10px 34px rgba(224,98,155,.35);

  --accent:#F394BC; --accent-2:#BA8AE0;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Roboto',system-ui,-apple-system,sans-serif;
  font-size:16px; font-weight:400; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s var(--ease), color .35s var(--ease);
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Poppins',sans-serif; margin:0; line-height:1.25; letter-spacing:-.015em}
h1{font-size:24px;font-weight:600}
h2{font-size:20px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--pink);color:#221C2A}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}

.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}
.ic-lg{width:24px;height:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================ APP SHELL */
.app{display:flex;min-height:100dvh}

.sidebar{
  width:var(--sidebar-w);flex:none;position:fixed;inset:0 auto 0 0;z-index:60;
  background:var(--sidebar);backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .42s var(--ease);
}
.sb-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;flex:none}
.sb-logo{width:40px;height:40px;border-radius:13px;object-fit:cover;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.sb-brand-txt strong{display:block;font-family:'Poppins';font-size:15.5px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.sb-brand-txt span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:500;margin-top:2px}
.sb-close{display:none;margin-left:auto;background:none;border:0;padding:6px;border-radius:10px;color:var(--text-2);cursor:pointer}

.sb-scroll{flex:1;overflow-y:auto;padding:4px 12px 16px;overscroll-behavior:contain}
.sb-group{margin-bottom:18px}
.sb-group-label{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);padding:0 12px 8px;font-family:'Poppins'}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:9.5px 12px;border-radius:12px;border:0;background:none;cursor:pointer;
  color:var(--text-2);font-family:'Poppins';font-size:14px;font-weight:500;text-align:left;
  transition:background .22s var(--ease), color .22s var(--ease), transform .18s var(--ease);
}
.nav-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .ic{transition:transform .3s var(--ease), color .22s}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item:hover .ic{transform:translateX(1px) scale(1.06)}
.nav-item:active{transform:scale(.985)}
.nav-item.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.nav-item.active .ic{color:var(--accent)}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 4px 4px 0;background:var(--accent-grad-strong);
  animation:navMark .4s var(--ease);
}
@keyframes navMark{from{height:0;opacity:0}to{height:20px;opacity:1}}
.nav-badge{font-size:10.5px;font-weight:700;font-family:'Poppins';padding:2px 7px;border-radius:99px;background:var(--pink-soft);color:var(--pink-ink);letter-spacing:.02em}

.sb-foot{flex:none;padding:12px;border-top:1px solid var(--border)}
.sb-progress{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--shadow-xs)}
.sb-progress .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.sb-progress .row b{font-family:'Poppins';font-size:13px;font-weight:600}
.sb-progress .row i{font-style:normal;font-size:11.5px;color:var(--text-3);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent-grad-strong);transition:width 1.1s var(--ease);position:relative;overflow:hidden}
.bar>i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 2.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(200%)}}

.main{flex:1;min-width:0;margin-left:var(--sidebar-w);display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;height:var(--topbar-h);flex:none;
  display:flex;align-items:center;gap:12px;padding:0 24px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
}
.tb-menu{display:none;background:none;border:0;padding:8px;margin-left:-8px;border-radius:11px;color:var(--text);cursor:pointer}
.tb-greet{min-width:0;flex:1}
.tb-greet h1{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-greet p{font-size:12.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:9px;flex:none}

.icon-btn{
  width:40px;height:40px;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;
  box-shadow:var(--shadow-xs);
  transition:transform .18s var(--ease), box-shadow .22s var(--ease), color .2s, background .3s;
}
.icon-btn:hover{color:var(--text);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.icon-btn:active{transform:translateY(0) scale(.94);box-shadow:var(--shadow-xs)}

.theme-toggle{position:relative;overflow:hidden}
.theme-toggle .ic{transition:transform .5s var(--ease), opacity .3s}
.theme-toggle .ic-sun{position:absolute;opacity:0;transform:rotate(-90deg) scale(.4)}
[data-theme="dark"] .theme-toggle .ic-moon{opacity:0;transform:rotate(90deg) scale(.4)}
[data-theme="dark"] .theme-toggle .ic-sun{opacity:1;transform:none}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 18px;height:44px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  font-family:'Poppins';font-size:15px;font-weight:500;letter-spacing:-.01em;
  transition:transform .16s var(--ease), box-shadow .24s var(--ease), background .25s, opacity .2s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px) scale(.975)}
.btn-primary{background:var(--accent-grad-strong);color:#fff;box-shadow:var(--shadow-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(224,98,155,.4)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text-2);box-shadow:var(--shadow-xs)}
.btn-ghost:hover{color:var(--text);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.btn-soft{background:var(--surface-3);color:var(--text);border-color:transparent}
.btn-soft:hover{background:var(--border);transform:translateY(-2px)}
.btn-sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:11px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}

.avatar{
  width:40px;height:40px;border-radius:13px;flex:none;cursor:pointer;position:relative;
  background:var(--accent-grad);display:grid;place-items:center;
  font-family:'Poppins';font-weight:600;font-size:15px;color:#3B2E44;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
  transition:transform .2s var(--ease), box-shadow .22s;
}
.avatar:hover{transform:translateY(-2px) scale(1.03);box-shadow:var(--shadow-md)}
.avatar::after{content:'';position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:99px;background:var(--mint);border:2.2px solid var(--surface)}

.stage{flex:1;padding:28px 24px 96px;max-width:1320px;width:100%;margin:0 auto}
.view{animation:viewIn .44s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.view.back{animation:viewInBack .44s var(--ease) both}
@keyframes viewInBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .t{flex:1;min-width:220px}
.page-head h1{font-size:26px;font-weight:600}
.page-head p{color:var(--text-2);font-size:14.5px;margin-top:4px}
.page-head .a{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- CARDS / GRID ---------- */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.span2{grid-column:span 2}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border-2)}
.card-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.card-head h3{flex:1;min-width:0}
.card-head .sub{font-size:12.5px;color:var(--text-3);font-weight:400;font-family:'Roboto'}
.chip-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.chip-ic.pink{background:var(--pink-soft);color:var(--pink-ink)}
.chip-ic.mint{background:var(--mint-soft);color:var(--mint-ink)}
.chip-ic.blue{background:var(--blue-soft);color:var(--blue-ink)}
.chip-ic.lilac{background:var(--lilac-soft);color:var(--lilac-ink)}
.chip-ic.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:'Poppins';font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.01em}
.tag.pink{background:var(--pink-soft);color:var(--pink-ink)}
.tag.mint{background:var(--mint-soft);color:var(--mint-ink)}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.tag.lilac{background:var(--lilac-soft);color:var(--lilac-ink)}
.tag.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.tag.gray{background:var(--surface-3);color:var(--text-2)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:600;font-family:'Poppins'}
.stat .v{font-family:'Poppins';font-size:29px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.stat .v small{font-size:14px;font-weight:500;color:var(--text-3);letter-spacing:0}
.stat .d{font-size:12.5px;color:var(--text-2)}

.divider{height:1px;background:var(--border);margin:16px 0;border:0}

.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty .ic{width:34px;height:34px;margin-bottom:12px;stroke-width:1.3;opacity:.7}
.empty h3{font-size:15.5px;color:var(--text-2);margin-bottom:5px}
.empty p{font-size:13.5px;max-width:330px;margin:0 auto 16px}

/* ---------- HERO ---------- */
.hero{
  position:relative;border-radius:var(--r-xl);overflow:hidden;padding:30px 32px;
  color:#fff;box-shadow:var(--shadow-lg);min-height:214px;display:flex;flex-direction:column;justify-content:flex-end;
}
.hero-bg{position:absolute;inset:0;background-image:url('banner%20backgraud.jpg.jpeg');background-size:cover;background-position:center;transform:scale(1.06);animation:heroPan 26s var(--ease-in-out) infinite alternate}
@keyframes heroPan{from{transform:scale(1.06) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-1.5%,-1.5%,0)}}
.hero-veil{position:absolute;inset:0;background:linear-gradient(115deg,rgba(58,26,48,.86) 0%,rgba(72,38,96,.62) 45%,rgba(30,64,110,.44) 100%)}
.hero-veil2{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,10,26,.7) 0%,transparent 62%)}
.hero>h2,.hero>.sub,.hero>.hero-chips{position:relative;z-index:2}
.hero-top{position:absolute;top:22px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.hero h2{font-size:31px;font-weight:600;letter-spacing:-.03em;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero .sub{font-size:14px;opacity:.9;margin-top:5px;max-width:52ch}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.24);font-family:'Poppins';font-size:12.5px;font-weight:500}
.hero-chip b{font-weight:600}

.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-linecap:round}
.ring .trk{stroke:var(--surface-3)}
.ring .val{stroke:url(#ringGrad);transition:stroke-dashoffset 1.4s var(--ease)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{display:block;font-family:'Poppins';font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ring .lbl span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:600;font-family:'Poppins'}

/* ---------- FORM ---------- */
.field{margin-bottom:15px}
.field>label{display:block;font-family:'Poppins';font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px;letter-spacing:.01em}
.input,textarea.input,select.input{
  width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border-2);
  background:var(--surface-2);color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s, box-shadow .25s, background .25s;
}
textarea.input{resize:vertical;min-height:104px;line-height:1.65;font-family:'Roboto'}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(224,98,155,.14);background:var(--surface)}
.input::placeholder{color:var(--text-3)}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239A93A6' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:17px;padding-right:38px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}

.seg{display:flex;gap:6px;padding:4px;background:var(--surface-3);border-radius:13px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;white-space:nowrap;padding:8px 14px;border:0;border-radius:10px;background:none;cursor:pointer;
  font-family:'Poppins';font-size:13.5px;font-weight:500;color:var(--text-2);
  transition:all .24s var(--ease);
}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.seg button:not(.on):hover{color:var(--text)}

.moods{display:flex;gap:9px;flex-wrap:wrap}
.mood{
  width:54px;height:54px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface-2);
  display:grid;place-items:center;font-size:24px;cursor:pointer;line-height:1;
  transition:transform .22s var(--ease), border-color .22s, background .22s, box-shadow .22s;
}
.mood:hover{transform:translateY(-3px) scale(1.05);box-shadow:var(--shadow-md)}
.mood.on{border-color:var(--accent);background:var(--pink-soft);transform:translateY(-3px) scale(1.06);box-shadow:var(--shadow-glow)}

.list{display:flex;flex-direction:column;gap:10px}
.row-item{
  display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:15px;
  background:var(--surface-2);border:1px solid var(--border);
  transition:transform .22s var(--ease), box-shadow .22s, border-color .22s, background .22s;
}
.row-item:hover{transform:translateX(3px);box-shadow:var(--shadow-sm);border-color:var(--border-2)}
.row-item .body{flex:1;min-width:0}
.row-item .body b{display:block;font-family:'Poppins';font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.row-item .body small{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px}
.row-actions{display:flex;gap:5px;flex:none;opacity:.55;transition:opacity .2s}
.row-item:hover .row-actions{opacity:1}
.mini-btn{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;border:0;background:none;color:var(--text-3);cursor:pointer;transition:all .18s var(--ease)}
.mini-btn:hover{background:var(--surface-3);color:var(--text)}
.mini-btn.danger:hover{background:var(--pink-soft);color:var(--pink-ink)}

.chk{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);transition:all .22s var(--ease);position:relative}
.chk:hover{border-color:var(--border-2);transform:translateX(3px)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .box{width:22px;height:22px;flex:none;border-radius:7px;border:1.8px solid var(--border-2);display:grid;place-items:center;transition:all .28s var(--ease);background:var(--surface)}
.chk .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .05s}
.chk input:checked+.box{background:var(--accent-grad-strong);border-color:transparent;transform:scale(1.06)}
.chk input:checked+.box svg{stroke-dashoffset:0}
.chk .txt{flex:1;font-size:14.5px;transition:all .28s var(--ease)}
.chk input:checked~.txt{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border-2)}

/* ---------- CALENDÁRIO ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-head b{flex:1;font-family:'Poppins';font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-family:'Poppins';font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding-bottom:6px}
.cal-day{
  position:relative;aspect-ratio:1;border-radius:12px;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;font-family:'Poppins';font-size:13.5px;font-weight:500;color:var(--text-2);
  transition:all .2s var(--ease);
}
.cal-day:hover{background:var(--surface-3);color:var(--text);transform:scale(1.08)}
.cal-day.out{opacity:.28;pointer-events:none}
.cal-day.today{color:var(--accent);font-weight:700;background:var(--pink-soft)}
.cal-day.has::after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:99px;background:var(--accent-2)}
.cal-day.sel{background:var(--accent-grad-strong);color:#fff;box-shadow:var(--shadow-glow);transform:scale(1.06)}
.cal-day.sel::after{background:#fff}

/* ---------- ÁGUA ---------- */
.water-wrap{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap}
.glass-vis{position:relative;width:132px;height:180px;flex:none}
.glass-body{position:absolute;inset:0;border:3px solid var(--border-2);border-top:0;border-radius:10px 10px 30px 30px;overflow:hidden;background:var(--surface-2)}
.glass-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#8FC4F2,#5C9FE0);transition:height 1s var(--ease)}
.glass-fill::before,.glass-fill::after{content:'';position:absolute;left:-50%;width:200%;height:22px;top:-11px;background:rgba(255,255,255,.35);border-radius:44%;animation:wave 5.5s linear infinite}
.glass-fill::after{animation-duration:8s;animation-direction:reverse;opacity:.5;top:-8px}
@keyframes wave{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.glass-lbl{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;font-family:'Poppins'}
.glass-lbl b{display:block;font-size:25px;font-weight:600;letter-spacing:-.03em;color:var(--text);text-shadow:0 1px 10px var(--surface)}
.glass-lbl span{font-size:11.5px;color:var(--text-2);font-weight:500}
.cup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.cup{
  padding:13px 8px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--blue-ink);
  font-family:'Poppins';font-size:12px;font-weight:600;
  transition:all .22s var(--ease);
}
.cup:hover{transform:translateY(-3px);border-color:var(--blue);background:var(--blue-soft);box-shadow:var(--shadow-md)}
.cup:active{transform:scale(.94)}

/* ---------- MEMÓRIAS ---------- */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.mem{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:transform .32s var(--ease),box-shadow .32s var(--ease);cursor:pointer;position:relative}
.mem:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:var(--shadow-lg)}
.mem-photo{aspect-ratio:4/3;background:var(--surface-3);position:relative;overflow:hidden}
.mem-photo img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);display:block}
.mem:hover .mem-photo img{transform:scale(1.06)}
.mem-photo .ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--accent-grad);color:#fff}
.mem-body{padding:14px 16px 16px}
.mem-body .m{font-size:22px;line-height:1;margin-bottom:8px;display:block}
.mem-body b{display:block;font-family:'Poppins';font-size:13px;font-weight:600;color:var(--text-3);letter-spacing:.02em;margin-bottom:5px}
.mem-body p{font-size:14px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}

/* ---------- CHARTS ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--border);stroke-width:1}
.chart .glab{font-size:10px;fill:var(--text-3);font-family:'Poppins';font-weight:500}
.chart .lin{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.6s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .dot{stroke:var(--surface);stroke-width:2.4;opacity:0;animation:pop .4s var(--ease) forwards}
@keyframes pop{from{opacity:0}to{opacity:1}}
.chart .barr{animation:growBar .8s var(--ease) both;transform-origin:bottom;transform-box:fill-box}
@keyframes growBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- CARREGAMENTO PREMIUM (IA) ---------- */
.ai-overlay{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;
  background:rgba(12,10,17,.42);backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  opacity:0;pointer-events:none;transition:opacity .34s var(--ease);
}
[data-theme="dark"] .ai-overlay{background:rgba(5,4,8,.62)}
.ai-overlay.on{opacity:1;pointer-events:auto}
.ai-card{
  width:min(420px,100%);background:var(--surface);border:1px solid var(--border-2);
  border-radius:var(--r-xl);padding:34px 30px 26px;box-shadow:var(--shadow-lg);text-align:center;
  transform:translateY(22px) scale(.95);opacity:0;transition:all .44s var(--ease);
}
.ai-overlay.on .ai-card{transform:none;opacity:1}

.orb{position:relative;width:84px;height:84px;margin:0 auto 22px}
.orb-core{
  position:absolute;inset:14px;border-radius:50%;
  background:conic-gradient(from 0deg,#F8BBD0,#E1BEE7,#BBDEFB,#A5D6A7,#FFF59D,#F8BBD0);
  animation:spin 3.4s linear infinite;
}
.orb-core::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.orb-glow{position:absolute;inset:6px;border-radius:50%;background:conic-gradient(from 90deg,#F8BBD0,#BBDEFB,#E1BEE7,#F8BBD0);filter:blur(13px);opacity:.7;animation:spin 4.6s linear infinite reverse}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--border-2);animation:pulseRing 2.4s var(--ease) infinite}
.orb-ring.r2{animation-delay:.8s}
.orb-ring.r3{animation-delay:1.6s}
.orb-dot{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:orbit 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseRing{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes orbit{from{transform:rotate(0deg) translateX(42px) rotate(0deg)}to{transform:rotate(360deg) translateX(42px) rotate(-360deg)}}

.ai-card h3{font-size:18px;margin-bottom:4px}
.ai-sub{font-size:12.5px;color:var(--text-3);margin-bottom:20px}
.ai-steps{text-align:left;display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.ai-step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-3);opacity:.4;transition:all .4s var(--ease)}
.ai-step .mk{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;transition:border-color .4s,background .4s}
.ai-step .mk svg{width:10px;height:10px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .3s .1s}
.ai-step.run{opacity:1;color:var(--text)}
.ai-step.run .mk{border-color:var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.ai-step.done{opacity:1;color:var(--text-2)}
.ai-step.done .mk{background:var(--accent-grad-strong);border-color:transparent;animation:none}
.ai-step.done .mk svg{opacity:1}
.ai-bar{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:12px}
.ai-bar>i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent-grad-strong);transition:width .5s var(--ease)}
.ai-foot{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-family:'Poppins';font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.ai-foot .ic{width:13px;height:13px;color:var(--accent)}

.nprogress{position:fixed;top:0;left:0;height:2.5px;z-index:300;width:0;background:var(--accent-grad-strong);box-shadow:0 0 14px var(--accent);opacity:0;transition:width .3s var(--ease),opacity .3s}
.nprogress.on{opacity:1}

.sk{background:linear-gradient(90deg,var(--surface-3) 25%,var(--border) 37%,var(--surface-3) 63%);background-size:400% 100%;animation:skwave 1.35s ease infinite;border-radius:10px}
@keyframes skwave{from{background-position:100% 50%}to{background-position:0 50%}}
.sk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-sm)}
.sk-line{height:12px;margin-bottom:11px}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(12,10,17,.44);backdrop-filter:blur(9px);opacity:0;pointer-events:none;transition:opacity .32s var(--ease);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{opacity:1;pointer-events:auto}
.modal{
  width:min(560px,100%);max-height:88dvh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);transform:translateY(28px) scale(.96);opacity:0;
  transition:all .4s var(--ease);
}
.modal-bg.on .modal{transform:none;opacity:1}
.modal-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px;flex:none}
.modal-head h2{flex:1;font-size:19px}
.modal-body{padding:4px 22px 6px;overflow-y:auto;flex:1}
.modal-foot{display:flex;gap:10px;padding:16px 22px 20px;flex:none;border-top:1px solid var(--border);margin-top:8px}
.modal-foot .btn{flex:1}

/* ---------- TOAST + CORAÇÃO ---------- */
.toasts{position:fixed;bottom:22px;right:22px;z-index:250;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:11px;padding:13px 17px;border-radius:15px;
  background:var(--surface);border:1px solid var(--border-2);box-shadow:var(--shadow-lg);
  font-size:14px;font-weight:500;max-width:340px;
  animation:toastIn .48s var(--ease) both;
}
.toast.out{animation:toastOut .34s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(60px) scale(.9)}}
.toast .ic{color:var(--mint-ink)}

.heart-pop{position:fixed;z-index:260;pointer-events:none;color:var(--accent);animation:heartPop 1.15s var(--ease) forwards}
.heart-pop svg{width:56px;height:56px;fill:currentColor;stroke:none;filter:drop-shadow(0 6px 20px rgba(224,98,155,.5))}
@keyframes heartPop{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  18%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
  32%{transform:translate(-50%,-50%) scale(.95)}
  46%{transform:translate(-50%,-58%) scale(1.1)}
  100%{transform:translate(-50%,-190%) scale(.65);opacity:0}
}
.confetti{position:fixed;z-index:255;pointer-events:none;width:8px;height:8px;border-radius:2px;animation:conf 1.5s var(--ease) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--border);
}
.bn-inner{display:flex;justify-content:space-around;align-items:center;gap:4px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;cursor:pointer;color:var(--text-3);font-family:'Poppins';font-size:10px;font-weight:500;border-radius:12px;transition:color .22s,transform .22s var(--ease)}
.bn-item.active{color:var(--accent)}
.bn-item.active .ic{transform:translateY(-2px) scale(1.08)}
.bn-item .ic{transition:transform .3s var(--ease)}
.bn-item:active{transform:scale(.92)}
.bn-fab{
  width:48px;height:48px;border-radius:16px;border:0;margin-top:-22px;flex:none;
  background:var(--accent-grad-strong);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--shadow-glow);transition:transform .2s var(--ease)
}
.bn-fab:active{transform:scale(.9)}

.scrim{position:fixed;inset:0;z-index:55;background:rgba(12,10,17,.45);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .34s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- ARTIGOS / FÓRUM / TIMELINE ---------- */
.article{display:flex;gap:15px;padding:15px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all .28s var(--ease)}
.article:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-2)}
.article .thumb{width:62px;height:62px;flex:none;border-radius:14px;display:grid;place-items:center}
.article .body{flex:1;min-width:0}
.article .body b{display:block;font-family:'Poppins';font-size:14.5px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.article .body p{font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article .meta{display:flex;gap:9px;margin-top:7px;font-size:11.5px;color:var(--text-3);font-family:'Poppins';font-weight:500}

.post{padding:18px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface-2);transition:all .28s var(--ease)}
.post:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.post-av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:'Poppins';font-weight:600;font-size:14px;flex:none}
.post-head b{display:block;font-family:'Poppins';font-size:14px;font-weight:600}
.post-head small{color:var(--text-3);font-size:12px}
.post p{font-size:14.5px;color:var(--text-2);line-height:1.65;white-space:pre-wrap}
.post-foot{display:flex;gap:8px;margin-top:13px;align-items:center;flex-wrap:wrap}
.like-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:13px;font-family:'Poppins';font-weight:500;transition:all .22s var(--ease)}
.like-btn:hover{border-color:var(--pink);color:var(--pink-ink);transform:translateY(-2px)}
.like-btn.on{background:var(--pink-soft);border-color:transparent;color:var(--pink-ink)}
.like-btn.on .ic{fill:currentColor;animation:heartBeat .5s var(--ease)}
@keyframes heartBeat{0%,100%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.92)}}

.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--pink),var(--lilac),var(--blue));border-radius:99px}
.tl-item{position:relative;padding-bottom:20px}
.tl-item::before{content:'';position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:99px;background:var(--surface);border:2.5px solid var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tl-item.dim::before{border-color:var(--border-2)}
.tl-item b{font-family:'Poppins';font-size:14.5px;font-weight:600;display:block}
.tl-item small{color:var(--text-3);font-size:12.5px}
.tl-item p{font-size:14px;color:var(--text-2);margin-top:4px}

.kick-pad{
  width:100%;aspect-ratio:1/.82;max-width:290px;margin:0 auto;border-radius:36px;border:0;cursor:pointer;
  background:var(--accent-grad);color:#3B2E44;display:grid;place-items:center;text-align:center;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  transition:transform .16s var(--ease);font-family:'Poppins';
}
.kick-pad:active{transform:scale(.955)}
.kick-pad b{display:block;font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.kick-pad span{font-size:13px;font-weight:500;opacity:.75}
.kick-pad .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:translate(-50%,-50%) scale(0);animation:rip .7s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(9);opacity:0}}

/* ---------- RESPONSIVO ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side{grid-template-columns:1fr}
}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .sb-close{display:block}
  .main{margin-left:0}
  .tb-menu{display:block}
  .bottomnav{display:block}
  .stage{padding:20px 16px 118px}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:24px 22px;min-height:190px}
  .hero-top{top:18px;left:22px;right:22px}
  .hero h2{font-size:25px}
  .toasts{bottom:100px;left:16px;right:16px;align-items:stretch}
  .toast{max-width:none}
}
@media (max-width:620px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2{grid-column:span 1}
  .topbar{padding:0 16px;gap:8px}
  .tb-greet h1{font-size:16.5px}
  .tb-greet p{font-size:11.5px}
  .btn-add-txt{display:none}
  .btn-add{width:44px;padding:0}
  .field-row{grid-template-columns:1fr}
  .page-head h1{font-size:22px}
  .card{padding:18px;border-radius:var(--r-md)}
  .mem-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .modal{border-radius:var(--r-lg)}
  .water-wrap{gap:18px}
  .hero{min-height:0;padding:20px 20px 22px}
  .hero-top{position:relative;top:auto;left:auto;right:auto;margin-bottom:14px;flex-wrap:wrap;gap:8px;justify-content:flex-start}
  .hero h2{font-size:23px}
  .hero-chip{padding:6px 11px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<!-- ============ SPRITE DE ÍCONES (traço premium, sem emoji) ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

const $  = (s,r=document)=>r.querySelector(s);

const ic = (n,c='ic')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const uid= ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad= n=>String(n).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc = s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];

const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = ()=>iso(new Date());
const parseISO = s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt = s=>{if(!s)return '—';const d=parseISO(s);return `${pad(d.getDate())} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`};
const fmtShort=s=>{if(!s)return '—';const d=parseISO(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const diasEntre=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);

/* ---------------- estado ---------------- */
const KEY='diario_gestacao_v1';
function defaults(){
  const dum = iso(addDays(new Date(),-158));
  return {
    profile:{nome:'',bebe:'',dum,dpp:iso(addDays(parseISO(dum),280)),sexo:'surpresa',tipoSangue:'',
             altura:165,pesoInicial:62,medico:'',hospital:'',gestacao:1},
    theme:'light', onboarded:false,
    entries:[], consultas:[], perguntas:[], sintomas:[], pesos:[],
    agua:{}, metaAgua:2500, refeicoes:[], chutes:[],
    checklist:{}, checklistCustom:[], mala:{}, malaCustom:[], plano:{},
    posts:null, likes:{},
    config:{lembretes:true, animacoes:true, semanaAuto:true}
  };
}
let state = defaults();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) state=Object.assign(defaults(),JSON.parse(raw)); }catch(e){}
  if(!state.posts) state.posts = seedPosts();
}
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Armazenamento cheio — remova algumas fotos','warn')} },180); }

/* ---------------- cálculo gestacional ---------------- */
function gest(){
  const p=state.profile;
  if(!p.dpp) return {ok:false,w:0,d:0,total:0,pct:0,rest:0,tri:1};
  const rest = diasEntre(hoje(), p.dpp);
  const total= clamp(280-rest,0,294);
  const w=Math.floor(total/7), d=total%7;
  const tri = w<14?1:(w<28?2:3);
  return {ok:true,w,d,total,rest,pct:clamp(total/280*100,0,100),tri};
}

/* ---------------- feedback visual ---------------- */
function toast(msg,tipo='ok'){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`${ic(tipo==='ok'?'check':(tipo==='warn'?'bell':'spark'))}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),340)},2900);
}
function heartPop(x,y){
  const el=document.createElement('div');
  el.className='heart-pop';
  el.style.left=(x??innerWidth/2)+'px'; el.style.top=(y??innerHeight/2)+'px';
  el.innerHTML=`<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-10.6A4.7 4.7 0 0 1 12 7.4a4.7 4.7 0 0 1 8 3c0 5.4-8 10.6-8 10.6Z"/></svg>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}
function confetti(x,y){
  const cores=['#F8BBD0','#A5D6A7','#FFF59D','#BBDEFB','#E1BEE7'];
  for(let i=0;i<16;i++){
    const c=document.createElement('i');
    c.className='confetti';
    c.style.left=x+'px'; c.style.top=y+'px';
    c.style.background=cores[i%5];
    c.style.setProperty('--dx',(Math.random()*220-110)+'px');
    c.style.setProperty('--dy',(-Math.random()*160-40)+'px');
    c.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1550);
  }
}

  $('#aiTitle').textContent=title; $('#aiSub').textContent=sub;
  $('#aiSteps').innerHTML=steps.map((s,i)=>
    `<div class="ai-step" data-i="${i}"><span class="mk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span>${esc(s)}</span></div>`).join('');
  $('#aiBar').style.width='0%';
  ov.classList.add('on'); aiBusy=true;
  let result;
  const job = work ? Promise.resolve().then(work) : Promise.resolve();
  for(let i=0;i<steps.length;i++){
    const el=$(`.ai-step[data-i="${i}"]`);
    el.classList.add('run');
    await sleep(240+Math.random()*300);
    el.classList.remove('run'); el.classList.add('done');
    $('#aiBar').style.width=Math.round((i+1)/steps.length*100)+'%';
  }
  try{ result=await job; }catch(e){ console.error(e); }
  await sleep(240);
  ov.classList.remove('on'); aiBusy=false;
  return result;
}

/* barra fina de navegação */
let npT;
function nprogStart(){
  const el=$('#nprog'); clearTimeout(npT);
  el.classList.add('on'); el.style.width='0%';
  requestAnimationFrame(()=>{el.style.width='62%'});
}
function nprogDone(){
  const el=$('#nprog'); el.style.width='100%';
  npT=setTimeout(()=>{el.classList.remove('on');setTimeout(()=>el.style.width='0%',300)},260);
}

/* ---------------- modal ---------------- */
let modalSubmit=null;
function openModal({title,icon='spark',cor='pink',body,ok='Salvar',cancel='Cancelar',onOk,wide}){

const NAV=[
 {g:'Principal',items:[
   {id:'painel',t:'Painel Principal',i:'dash'},
   {id:'perfil',t:'Perfil da Gestação',i:'profile'},
   {id:'consultas',t:'Consultas',i:'calendar'},
   {id:'sintomas',t:'Sintomas',i:'pulse'},

 {g:'Cuidados diários',items:[

 {g:'Preparação',items:[

const ICONES={};NAV.forEach(g=>g.items.forEach(i=>ICONES[i.id]=i.i));

let view='painel';

function renderNav(){
  $('#navRoot').innerHTML = NAV.map(gr=>`
    <div class="sb-group">

      ${gr.items.map(it=>`

const bnBtn=(id,i,t)=>`<button class="bn-item${view===id?' active':''}" data-go="${id}">${ic(i)}<span>${t}</span></button>`;

function navBadge(id){
  if(id==='consultas'){
    const n=state.consultas.filter(c=>c.data>=hoje()).length;
    return n?`<span class="nav-badge">${n}</span>`:'';
  }
  if(id==='agua'){
    const g=gest(); const ml=state.agua[hoje()]||0;
    return ml>=state.metaAgua?`<span class="nav-badge" style="background:var(--mint-soft);color:var(--mint-ink)">ok</span>`:'';
  }
  return '';
}

const PESADAS=new Set(['analises','crescimento']);
async function go(id,fromNav=true){
  if(aiBusy) return;
  closeSidebar();
  if(id===view && $('#stage').dataset.ready==='1'){ return; }
  const dir = ORDEM.indexOf(id) < ORDEM.indexOf(view) ? 'back':'fwd';
  view=id; renderNav(); updateTopbar();
  location.hash=id;
  $('#stage').dataset.ready='0';

  if(PESADAS.has(id)){
    $('#stage').innerHTML=skeleton(id);
    await aiRun(
      id==='analises'?'Compilando suas análises':'Modelando o crescimento',
      id==='analises'?'Correlacionando registros da sua gestação':'Comparando com curvas de referência da OMS',
      id==='analises'
        ? ['Reunindo registros locais','Normalizando séries temporais','Detectando padrões e correlações','Gerando insights personalizados']
        : ['Lendo idade gestacional','Carregando curvas de referência','Projetando peso e comprimento','Preparando visualização']
    );
  }else{
    nprogStart();
    $('#stage').innerHTML=skeleton(id);
    await sleep(280+Math.random()*180);
    nprogDone();
  }
  paint(dir);
}
function paint(dir='fwd'){
  const html = (VIEWS[view]||VIEWS.painel)();
  $('#stage').innerHTML=`<div class="view${dir==='back'?' back':''}">${html}</div>`;
  $('#stage').dataset.ready='1';
  if(BIND[view]) BIND[view]();
  updateSidebarProgress();
  $('#stage').scrollTop=0; window.scrollTo({top:0,behavior:'smooth'});
}
function repaint(){ // re-render sem carregamento
  const html=(VIEWS[view]||VIEWS.painel)();
  $('#stage').innerHTML=`<div class="view" style="animation:none">${html}</div>`;
  if(BIND[view]) BIND[view]();
  renderNav(); updateSidebarProgress();
}

function skeleton(id){
  const card=(h)=>`<div class="sk-card"><div class="sk sk-line" style="width:38%"></div><div class="sk sk-line" style="width:82%"></div><div class="sk sk-line" style="width:64%"></div><div class="sk" style="height:${h}px;margin-top:14px"></div></div>`;
  return `<div class="grid" style="gap:18px">
    <div class="sk" style="height:118px;border-radius:22px"></div>
    <div class="grid g3">${card(70)}${card(70)}${card(70)}</div>
    <div class="grid g-side">${card(180)}${card(180)}</div>
  </div>`;
}

<script>
/* ============================================================
   Gráficos (SVG puro)
   ============================================================ */
function chartLine(data,o={}){
  const w=o.w||620,h=o.h||200,pl=38,pr=14,pt=16,pb=28;
  if(!data.length) return emptyBox(o.vazio||'Sem dados ainda');
  const ys=data.map(d=>d.y); let min=Math.min(...ys),max=Math.max(...ys);
  if(min===max){min-=1;max+=1}
  const r=max-min; min-=r*.18; max+=r*.18;
  const X=i=>pl+(data.length===1?(w-pl-pr)/2:i*(w-pl-pr)/(data.length-1));
  const Y=v=>pt+(1-(v-min)/(max-min))*(h-pt-pb);
  const p=data.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(d.y).toFixed(1)}`).join(' ');
  const area=`${p} L${X(data.length-1).toFixed(1)} ${h-pb} L${X(0).toFixed(1)} ${h-pb} Z`;
  let grid='';
  for(let i=0;i<=3;i++){
    const v=min+(max-min)*i/3, y=Y(v);
    grid+=`<line class="axis" x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke-dasharray="3 5"/>
           <text class="glab" x="4" y="${(y+3.5).toFixed(1)}">${v.toFixed(o.dec??0)}</text>`;
  }
  const step=Math.ceil(data.length/7);
  const xlab=data.map((d,i)=> (i%step===0||i===data.length-1)?`<text class="glab" x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(d.x)}</text>`:'').join('');
  const dots=data.map((d,i)=>`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(d.y).toFixed(1)}" r="4" fill="${o.cor||'#EE7FAE'}" style="animation-delay:${(.9+i*.05).toFixed(2)}s"><title>${esc(d.x)}: ${d.y}${o.un||''}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
    ${grid}<path d="${area}" fill="${o.fill||'url(#chartPink)'}"/>
    <path class="lin" d="${p}" stroke="${o.stroke||'url(#lineGrad)'}"/>${dots}${xlab}</svg>`;
}
function chartBars(data,o={}){
  const w=o.w||620,h=o.h||190,pl=38,pr=14,pt=16,pb=30;
  if(!data.length) return emptyBox(o.vazio||'Sem dados ainda');
  const max=Math.max(o.max||0,...data.map(d=>d.y))*1.12||1;
  const bw=(w-pl-pr)/data.length, bar=Math.min(bw*.56,38);
  let grid='';
  for(let i=0;i<=3;i++){
    const v=max*i/3, y=pt+(1-i/3)*(h-pt-pb);
    grid+=`<line class="axis" x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke-dasharray="3 5"/>
           <text class="glab" x="4" y="${(y+3.5).toFixed(1)}">${Math.round(v)}</text>`;
  }
  const bars=data.map((d,i)=>{
    const bh=Math.max(2,(d.y/max)*(h-pt-pb)), x=pl+i*bw+(bw-bar)/2, y=h-pb-bh;
    return `<rect class="barr" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bar.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(6,bar/2).toFixed(1)}" fill="${d.cor||o.cor||'url(#lineGrad)'}" style="animation-delay:${(i*.06).toFixed(2)}s"><title>${esc(d.x)}: ${d.y}${o.un||''}</title></rect>
      <text class="glab" x="${(pl+i*bw+bw/2).toFixed(1)}" y="${h-10}" text-anchor="middle">${esc(d.x)}</text>`;
  }).join('');
  if(o.meta){ const y=h-pb-(o.meta/max)*(h-pt-pb);
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px">${grid}${bars}
      <line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="var(--mint-ink)" stroke-width="1.6" stroke-dasharray="6 5" opacity=".8"/></svg>`;
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="height:${h}px">${grid}${bars}</svg>`;
}
const emptyBox=(t)=>`<div class="empty">${ic('analytics')}<h3>${esc(t)}</h3><p>Os gráficos aparecem assim que você registrar os primeiros dados.</p></div>`;

function ringHTML(pct,label,sub){
  const R=42,C=2*Math.PI*R;
  return `<div class="ring"><svg viewBox="0 0 100 100">
    <circle class="trk" cx="50" cy="50" r="${R}" stroke-width="8"/>
    <circle class="val" cx="50" cy="50" r="${R}" stroke-width="8" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"/>
  </svg><div class="lbl"><div><b>${label}</b><span>${sub}</span></div></div></div>`;
}

/* ============================================================
   VIEWS
   ============================================================ */
const VIEWS={}, BIND={}, ADD_LABEL={};

/* util de resumo */
function aguaHoje(){ return state.agua[hoje()]||0 }
function chutesHoje(){ return state.chutes.filter(c=>c.data===hoje()).reduce((a,c)=>a+c.n,0) }
function proximaConsulta(){ return state.consultas.filter(c=>c.data>=hoje()).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora))[0] }
function pesoAtual(){ const p=[...state.pesos].sort((a,b)=>a.data.localeCompare(b.data)); return p.length?p[p.length-1]:null }
function ganhoPeso(){ const a=pesoAtual(); return a?+(a.peso-(state.profile.pesoInicial||a.peso)).toFixed(1):0 }
function imc(){ const p=state.profile.pesoInicial, h=(state.profile.altura||165)/100; return (p&&h)?+(p/(h*h)).toFixed(1):null }

function resumoIA(){
  const g=gest(); if(!g.ok) return 'Cadastre a data provável do parto no Perfil da Gestação para receber um resumo personalizado.';
  const b=babyAt(g.w);
  const ml=aguaHoje(), meta=state.metaAgua;
  const sint7=state.sintomas.filter(s=>diasEntre(s.data,hoje())<=7);
  const top=Object.entries(sint7.reduce((a,s)=>(a[s.tipo]=(a[s.tipo]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])[0];
  const c=proximaConsulta();
  let t=[];
  t.push(`Você está na semana ${g.w}${g.d?` e ${g.d} dia${g.d>1?'s':''}`:''} — ${TRI_NOME[g.tri].toLowerCase()}. O bebê tem aproximadamente ${b[2]} cm e ${b[3]>=1000?(b[3]/1000).toFixed(2)+' kg':b[3]+' g'}, o tamanho de um(a) ${b[1]}.`);
  if(ml>=meta) t.push(`Sua hidratação de hoje já atingiu a meta de ${(meta/1000).toFixed(1)} L. Excelente.`);
  else if(ml>0) t.push(`Você bebeu ${ml} ml hoje; faltam ${meta-ml} ml para a meta diária.`);
  else t.push(`Ainda não há registro de água hoje — a recomendação é de cerca de ${(meta/1000).toFixed(1)} L por dia na gestação.`);
  if(top) t.push(`Nos últimos 7 dias, o sintoma mais registrado foi "${top[0]}" (${top[1]}x). Vale comentar na próxima consulta.`);
  if(c) t.push(`Próxima consulta: ${fmt(c.data)} às ${c.hora} com ${c.medico||'seu médico'}.`);
  const m=MARCOS.filter(m=>m[0]>=g.w)[0];
  if(m) t.push(`Marco à frente: semana ${m[0]} — ${m[1]}. ${m[2]}`);
  return t.join(' ');
}

/* ============================== PAINEL ============================== */
ADD_LABEL.painel='Adicionar';
VIEWS.painel=()=>{
  const g=gest(), b=babyAt(g.w), c=proximaConsulta(), pa=pesoAtual();
  const ml=aguaHoje(), pctAgua=Math.round(ml/state.metaAgua*100);

  const marcos=MARCOS.map(m=>({w:m[0],t:m[1],d:m[2],feito:g.w>=m[0]}));
  const prox=marcos.filter(m=>!m.feito).slice(0,3);
  const feitos=marcos.filter(m=>m.feito).slice(-2);

  return `
  <section class="hero" style="margin-bottom:18px">
    <div class="hero-bg"></div><div class="hero-veil"></div><div class="hero-veil2"></div>
    <div class="hero-top">
      <span class="hero-chip">${ic('spark','ic ic-sm')} ${TRI_NOME[g.tri]}</span>

    </div>
    <h2>${g.ok?`Semana ${g.w}`:'Configure sua gestação'}${g.d?`<span style="font-size:18px;opacity:.75"> + ${g.d}d</span>`:''}</h2>
    <p class="sub">${g.ok?`Seu bebê está do tamanho de um(a) <b>${b[1]}</b> — cerca de ${b[2]} cm e ${b[3]>=1000?(b[3]/1000).toFixed(2)+' kg':b[3]+' g'}.`:'Informe a data da última menstruação ou a data provável do parto para começar.'}</p>
    <div class="hero-chips">
      <button class="hero-chip" data-go="memorias" style="cursor:pointer;border:1px solid rgba(255,255,255,.24);color:#fff">${ic('image','ic ic-sm')} Nova memória</button>
      <button class="hero-chip" data-go="crescimento" style="cursor:pointer;border:1px solid rgba(255,255,255,.24);color:#fff">${ic('growth','ic ic-sm')} Crescimento</button>
      <button class="hero-chip" data-go="consultas" style="cursor:pointer;border:1px solid rgba(255,255,255,.24);color:#fff">${ic('calendar','ic ic-sm')} Consultas</button>
    </div>

      <div class="stat"><div class="v">${ml}<small> ml</small></div><div class="d">${pctAgua}% da meta de ${state.metaAgua} ml</div></div>
      <div class="bar" style="margin-top:12px"><i style="width:${clamp(pctAgua,0,100)}%;background:linear-gradient(90deg,#8FC4F2,#5C9FE0)"></i></div>

    <div class="card">
      <div class="card-head">
        <span class="chip-ic lilac">${ic('spark')}</span>
