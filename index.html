BIND.comunidade=()=>{
  $$('[data-tag]').forEach(b=>b.onclick=()=>{filtroPost=b.dataset.tag;repaint()});
  $$('[data-like]').forEach(b=>b.onclick=e=>{
    const id=b.dataset.like;
    state.likes[id]=!state.likes[id]; save();
    if(state.likes[id]) heartPop(e.clientX,e.clientY);
    repaint();
  });
  $$('[data-delpost]').forEach(b=>b.onclick=()=>{state.posts=state.posts.filter(p=>p.id!==b.dataset.delpost);save();repaint();toast('Publicação removida')});
  $('#postBtn').onclick=()=>{
    const t=$('#postTxt').value.trim(); if(!t){toast('Escreva algo antes de publicar','warn');return}
    state.posts.unshift({id:uid(),autor:state.profile.nome||'Você',sem:gest().w,data:hoje(),txt:t,likes:0,tag:$('#postTag').value,meu:true});
    save(); repaint(); toast('Publicado na comunidade');
  };
};

<script>
/* ============================== ANÁLISES ============================== */
ADD_LABEL.analises='Registrar peso';
VIEWS.analises=()=>{
  const g=gest();
  const pesos=[...state.pesos].sort((a,b)=>a.data.localeCompare(b.data));
  const agua30=[];
  for(let i=29;i>=0;i--){const d=iso(addDays(new Date(),-i)); agua30.push({x:fmtShort(d),y:state.agua[d]||0})}
  const sint=[];
  for(let i=5;i>=0;i--){
    const ini=iso(addDays(new Date(),-(i*7+6))), fim=iso(addDays(new Date(),-i*7));
    sint.push({x:fmtShort(fim),y:state.sintomas.filter(s=>s.data>=ini&&s.data<=fim).length});
  }
  const mov=[];
  for(let i=13;i>=0;i--){const d=iso(addDays(new Date(),-i));
    mov.push({x:fmtShort(d),y:state.chutes.filter(c=>c.data===d).reduce((a,c)=>a+c.n,0)})}
  const mediaAgua=Math.round(agua30.reduce((a,s)=>a+s.y,0)/30);
  const diasReg=new Set([...state.sintomas.map(s=>s.data),...Object.keys(state.agua),...state.entries.map(e=>e.data)]).size;
  return `
  <div class="page-head"><div class="t"><h1>Análises</h1><p>Tudo o que você registrou, cruzado em um só lugar.</p></div>
    <div class="a"><button class="btn btn-ghost" id="btnExportA">${ic('download','ic ic-sm')} Exportar dados</button></div></div>

  <div class="grid g4" style="margin-bottom:18px">
    ${kpi('Semana atual',g.w,'de 40 semanas','pink','growth')}
    ${kpi('Ganho de peso',(ganhoPeso()>=0?'+':'')+ganhoPeso()+' kg',faixaGanho(),'mint','scale')}
    ${kpi('Média de água',mediaAgua+' ml','últimos 30 dias','blue','drop')}
    ${kpi('Dias com registro',diasReg,'sua constância','lilac','calendar')}
  </div>

  <div class="grid g2" style="margin-bottom:18px">
    <div class="card"><div class="card-head"><span class="chip-ic pink">${ic('scale')}</span><h3>Evolução do peso<div class="sub">kg por data registrada</div></h3></div>
      ${pesos.length>1?chartLine(pesos.map(p=>({x:fmtShort(p.data),y:p.peso})),{h:210,dec:1,un:' kg'}):emptyBox('Registre ao menos dois pesos')}
      <hr class="divider">
      <div class="list">${infoRow('IMC pré-gestacional',imc()?imc()+' kg/m²':'—',imc()?classIMC(imc()):'informe altura e peso')}
      ${infoRow('Faixa recomendada',faixaGanho().replace('recomendado ',''),'para todo o período')}</div></div>

    <div class="card"><div class="card-head"><span class="chip-ic blue">${ic('drop')}</span><h3>Hidratação<div class="sub">30 dias</div></h3></div>
      ${chartLine(agua30,{h:210,stroke:'#6FA8E8',fill:'url(#chartBlue)',cor:'#6FA8E8',un:' ml'})}
      <hr class="divider">
      <div class="list">${infoRow('Dias na meta',agua30.filter(a=>a.y>=state.metaAgua).length+'/30','meta de '+state.metaAgua+' ml')}</div></div>
  </div>

  <div class="grid g2" style="margin-bottom:18px">
    <div class="card"><div class="card-head"><span class="chip-ic yellow">${ic('pulse')}</span><h3>Sintomas por semana<div class="sub">6 semanas</div></h3></div>
      ${chartBars(sint,{h:200,cor:'#E5C15A',un:' registros'})}</div>
    <div class="card"><div class="card-head"><span class="chip-ic lilac">${ic('waves')}</span><h3>Movimentos<div class="sub">14 dias</div></h3></div>
      ${chartBars(mov,{h:200,meta:10,cor:'#B77BD8',un:' mov.'})}</div>
  </div>

  <div class="card">
    <div class="card-head"><span class="chip-ic lilac">${ic('spark')}</span><h3>Observações geradas dos seus dados</h3>
      <button class="btn btn-ghost btn-sm" id="btnReanalise">${ic('spark','ic ic-sm')} Reprocessar</button></div>
    <div class="list" id="insightsBox">${insights()}</div>
    <p class="hint">Análises estatísticas simples sobre seus próprios registros. Não constituem diagnóstico.</p>
  </div>`;
};
const kpi=(k,v,d,cor,i)=>`<div class="card"><div class="card-head"><span class="chip-ic ${cor}">${ic(i)}</span></div>
  <div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div></div>`;
function insights(){
  const out=[]; const g=gest();
  const pesos=[...state.pesos].sort((a,b)=>a.data.localeCompare(b.data));
  if(pesos.length>1){
    const dias=diasEntre(pesos[0].data,pesos[pesos.length-1].data)||1;
    const taxa=((pesos[pesos.length-1].peso-pesos[0].peso)/dias*7).toFixed(2);
    out.push(['Ritmo de ganho de peso',`Cerca de ${taxa} kg por semana entre os seus registros. No 2º e 3º trimestres, a faixa habitual fica entre 0,3 e 0,5 kg por semana.`]);
  }
  const a7=[],a14=[];
  for(let i=0;i<7;i++)a7.push(state.agua[iso(addDays(new Date(),-i))]||0);
  for(let i=7;i<14;i++)a14.push(state.agua[iso(addDays(new Date(),-i))]||0);
  const m7=a7.reduce((a,b)=>a+b,0)/7, m14=a14.reduce((a,b)=>a+b,0)/7;
  if(m7||m14) out.push(['Tendência de hidratação',`Média de ${Math.round(m7)} ml/dia nesta semana contra ${Math.round(m14)} ml/dia na anterior — ${m7>m14?'você melhorou':m7<m14?'houve queda':'estável'}.`]);
  const s=state.sintomas.filter(x=>diasEntre(x.data,hoje())<14);
  if(s.length){
    const f=Object.entries(s.reduce((a,x)=>(a[x.tipo]=(a[x.tipo]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])[0];
    out.push(['Sintoma predominante',`${f[0]} apareceu ${f[1]} vez(es) em 14 dias. ${dicaSintoma(f[0])}`]);
  }
  const mov7=[...Array(7)].map((_,i)=>state.chutes.filter(c=>c.data===iso(addDays(new Date(),-i))).reduce((a,c)=>a+c.n,0));
  if(g.w>=28){
    const dias0=mov7.filter(v=>v===0).length;
    out.push(['Movimentos fetais',dias0>2?`${dias0} dos últimos 7 dias sem registro de movimentos. Se isso reflete o que você sentiu de fato, avise seu obstetra.`:`Registros presentes em ${7-dias0} dos últimos 7 dias — bom acompanhamento.`]);
  }
  const c=proximaConsulta();
  out.push(['Acompanhamento',c?`Próxima consulta em ${Math.max(0,diasEntre(hoje(),c.data))} dias (${fmt(c.data)}).`:'Nenhuma consulta futura agendada — no 3º trimestre elas costumam ser quinzenais ou semanais.']);
  const chk=Object.values(CHECKLIST).flat();
  const pend=chk.filter(t=>!state.checklist[t]).length;
  out.push(['Preparação',`${chk.length-pend} de ${chk.length} itens da lista de verificação concluídos.`]);
  if(!out.length) return `<p style="color:var(--text-3)">Registre alguns dias de dados para gerar observações.</p>`;
  return out.map(o=>`<div class="row-item"><span class="chip-ic lilac">${ic('spark')}</span>
    <div class="body"><b>${esc(o[0])}</b><small>${esc(o[1])}</small></div></div>`).join('');
}
BIND.analises=()=>{
  $('#btnExportA').onclick=exportar;
  $('#btnReanalise').onclick=async()=>{
    await aiRun('Reprocessando análises','Recalculando séries e correlações',
      ['Lendo base local','Calculando médias móveis','Comparando janelas de 7 e 14 dias','Escrevendo observações']);
    $('#insightsBox').innerHTML=insights(); toast('Análises atualizadas');
  };
};

      <p class="hint">Os avisos aparecem dentro do aplicativo quando você o abre.</p>
    </div>

    <div class="card span2">
      <div class="card-head"><span class="chip-ic mint">${ic('download')}</span><h3>Seus dados</h3></div>
      <p style="font-size:14px;color:var(--text-2);margin-bottom:16px">Tudo fica armazenado apenas neste navegador — nada é enviado para servidores. Exporte com frequência para não perder seus registros.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">

        <input type="file" id="cfFile" accept="application/json" style="display:none">

      </div>
      <hr class="divider">
      <div class="grid g4">
        ${miniStat('Memórias',state.entries.length,'registros')}
        ${miniStat('Consultas',state.consultas.length,'agendadas')}

        As informações do aplicativo são educativas e não substituem o acompanhamento pré-natal.</p></div>

BIND.config=()=>{
  $('#cfSalvar').onclick=()=>{
    state.profile.nome=$('#cfNome').value.trim(); state.profile.bebe=$('#cfBebe').value.trim();
    save(); updateTopbar(); toast('Dados salvos');
  };
  $$('[data-tema]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.tema);repaint()});
  $('#cfAnim').onchange=e=>{state.config.animacoes=e.target.checked;save();
    document.documentElement.style.setProperty('--ease',e.target.checked?'cubic-bezier(.22,1,.36,1)':'linear')};
  $('#cfMetas').onclick=()=>{state.metaAgua=clamp(+$('#cfAgua').value||2500,500,6000);save();repaint();toast('Metas atualizadas')};
  $('#cfLemb').onchange=e=>{state.config.lembretes=e.target.checked;save()};
  $('#cfSem').onchange=e=>{state.config.semanaAuto=e.target.checked;save()};
  $('#cfExport').onclick=exportar;
  $('#cfImport').onclick=()=>$('#cfFile').click();
  $('#cfFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      state=Object.assign(defaults(),d); save(); setTheme(state.theme||'light');
      renderNav(); updateTopbar(); repaint(); toast('Backup importado com sucesso');
    }catch(err){ toast('Arquivo inválido','warn') } };
    r.readAsText(f);
  };
  $('#cfLimpar').onclick=()=>openModal({title:'Apagar todos os dados',icon:'trash',cor:'pink',
    body:`<p style="color:var(--text-2)">Isso remove permanentemente memórias, fotos, consultas, sintomas, pesos e listas deste navegador. A ação não pode ser desfeita.</p>
      <p class="hint" style="margin-top:12px">Sugestão: exporte um backup antes.</p>`,
    ok:'Apagar tudo',onOk:()=>{
      localStorage.removeItem(KEY); state=defaults(); state.posts=seedPosts();
      save(); setTheme('light'); renderNav(); updateTopbar(); repaint(); toast('Dados apagados');
    }});
};
function exportar(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`diario-gestacao-${hoje()}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup exportado');
}

/* ============================== AÇÃO RÁPIDA ============================== */
function quickAdd(e){
  const acoes={
    painel:()=>modalMemoria(), memorias:()=>modalMemoria(), dicas:()=>modalMemoria(),
    consultas:()=>modalConsulta(), sintomas:()=>modalSintoma(), nutricao:()=>modalRefeicao(),
    perfil:()=>modalPeso(), crescimento:()=>modalPeso(), analises:()=>modalPeso(),
    agua:()=>{ state.agua[hoje()]=(state.agua[hoje()]||0)+200; save(); repaint(); toast('200 ml registrados'); },
    movimentos:()=>{ go('movimentos'); toast('Toque no painel a cada movimento'); },
    checklist:()=>{ go('checklist').then?.(()=>{}); setTimeout(()=>$('#btnAddCheck')?.click(),700); },
    mala:()=>{ setTimeout(()=>$('#btnAddMala')?.click(),100); },
    parto:()=>{ setTimeout(()=>$('#btnPlanoResumo')?.click(),100); },
    comunidade:()=>{ $('#postTxt')?.focus(); },
    config:()=>modalMemoria()
  };
  (acoes[view]||acoes.painel)();
}
$('#btnAdd').onclick=quickAdd;

/* ============================== ONBOARDING ============================== */
function onboarding(){
  openModal({title:'Bem-vinda',icon:'heart',cor:'pink',cancel:'Depois',
    body:`<p style="color:var(--text-2);margin-bottom:16px">Vamos configurar o básico para que os cálculos da sua gestação fiquem corretos. Você pode mudar tudo depois em Perfil da Gestação.</p>
      <div class="field"><label>Como podemos te chamar?</label><input class="input" id="obNome" placeholder="Seu nome ou apelido"></div>
      <div class="field"><label>Data da última menstruação</label><input class="input" type="date" id="obDum" value="${state.profile.dum}"></div>
      <div class="field"><label>Ou informe a data provável do parto</label><input class="input" type="date" id="obDpp" value="${state.profile.dpp}"></div>
      <p class="hint">Seus dados ficam apenas neste dispositivo.</p>`,
    ok:'Começar',
    onOk:()=>{
      state.profile.nome=$('#obNome').value.trim()||'mamãe';
      const dum=$('#obDum').value, dpp=$('#obDpp').value;
      if(dum) state.profile.dum=dum;
      state.profile.dpp = dpp || (dum?iso(addDays(parseISO(dum),280)):state.profile.dpp);
      state.onboarded=true; save();
      closeModal();
      aiRun('Preparando seu diário','Calculando idade gestacional e montando seu painel',
        ['Salvando seu perfil','Calculando semana atual','Posicionando marcos da jornada','Montando o painel'])
        .then(()=>{ updateTopbar(); repaint(); toast(`Bem-vinda, ${state.profile.nome}`); });
      return false;
    }});
  $('#obDum').onchange=e=>{ if(e.target.value) $('#obDpp').value=iso(addDays(parseISO(e.target.value),280)); };
}

/* ============================== LEMBRETES ============================== */
function checarLembretes(){
  if(!state.config.lembretes) return;
  const c=proximaConsulta(); if(!c) return;
  const d=diasEntre(hoje(),c.data);
  if(d>=0&&d<=2) setTimeout(()=>toast(d===0?`Consulta hoje às ${c.hora}`:`Consulta em ${d} dia${d>1?'s':''}: ${c.titulo}`,'warn'),2200);
}

/* ============================== INICIALIZAÇÃO ============================== */
load();
document.documentElement.dataset.theme = state.theme||'light';
$('meta[name=theme-color]').setAttribute('content', state.theme==='dark'?'#0C0A11':'#F8BBD0');
if(!state.config.animacoes) document.documentElement.style.setProperty('--ease','linear');

const hashInicial=location.hash.replace('#','');
if(ORDEM.includes(hashInicial)) view=hashInicial;
renderNav(); updateTopbar(); updateSidebarProgress();

addEventListener('hashchange',()=>{
  const h=location.hash.replace('#','');
  if(ORDEM.includes(h)&&h!==view) go(h);
});
setInterval(updateTopbar,60000);

(async()=>{
  $('#stage').innerHTML=skeleton(view);
  await aiRun('Abrindo seu diário','Carregando registros salvos neste dispositivo',
    ['Verificando armazenamento local','Restaurando seus registros','Calculando idade gestacional','Preparando o painel']);
  paint();
  if(!state.onboarded) setTimeout(onboarding,500);
  else checarLembretes();
})();
</script>
</body>
</html>
